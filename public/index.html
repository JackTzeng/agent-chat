<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Chat</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf9; --line: #e6e1d6; --text: #2b2924; --muted: #8a857a;
    --accent: #c8643b; --accent-soft: #f6e4da; --user: #2f5d50; --tool: #6f6a60; --err: #b3261e;
    --claude: #c8643b; --codex: #3d6fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --panel: #24221f; --line: #36332e; --text: #ece7dd; --muted: #9c968a;
      --accent-soft: #3a2a22; --user: #3f7a69; --tool: #a59e91; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .app { display: grid; grid-template-columns: 260px 1fr; flex: 1; min-height: 0; }

  /* 側邊欄 */
  .side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side h1 { font-size: 15px; margin: 0; padding: 16px 16px 10px; letter-spacing: .5px; }
  .agents { overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .agent { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; position: relative; user-select: none; }
  .agent:hover { background: var(--bg); }
  .agent.active { background: var(--accent-soft); border-color: var(--line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
    background: var(--bg); border: 1px solid var(--line); flex: none; position: relative; }
  .agent .name { font-weight: 600; }
  .agent .role { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; color: #fff; margin-left: 6px; vertical-align: 1px; }
  .badge.claude { background: var(--claude); } .badge.codex { background: var(--codex); }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--panel); background: #9aa39a; }
  .agent.busy .dot { background: #e2a72e; animation: pulse 1s infinite; }
  .unread { position: absolute; right: 10px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
  .agent.has-unread .unread { display: block; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 聊天區 */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 9px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty .big { font-size: 48px; }
  .row { display: flex; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 32px; height: 32px; font-size: 17px; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: min(720px, 85%); overflow-wrap: anywhere; min-width: 0; }
  .row.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .row.bot .bubble { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .seg-tool { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--tool); padding: 2px 0; }
  .seg-error { color: var(--err); white-space: pre-wrap; font-size: 13.5px; }
  .seg-text + .seg-tool, .seg-tool + .seg-text { margin-top: 6px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .thinking { color: var(--muted); font-size: 13px; animation: pulse 1.2s infinite; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; }
  .md :not(pre) > code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  .md img, .md video { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 6px 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md a { color: var(--accent); }

  .composer { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  .composer .box { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px; max-height: 40vh; min-height: 42px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .hint { max-width: 900px; margin: 4px auto 0; font-size: 11px; color: var(--muted); }
  .row.relay .bubble { background: var(--accent-soft); color: var(--text); border: 1px dashed var(--accent); white-space: normal; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .row.user .who { text-align: right; }
  .col { display: flex; flex-direction: column; min-width: 0; max-width: min(720px, 85%); }
  .col .bubble { max-width: 100%; }
  .row.user .col { align-items: flex-end; }
  .sysline { text-align: center; font-size: 12px; color: var(--muted); }
  .sysline span { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; }
  .agent.all .avatar { background: var(--accent-soft); }
  /* 用量額度 */
  .usage { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12px; }
  .usage .uh { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .usage .uh button { padding: 1px 8px; font-size: 12px; border-radius: 7px; }
  .usage .eng { font-weight: 600; margin: 6px 0 2px; display: flex; justify-content: space-between; }
  .usage .eng small { font-weight: 400; color: var(--muted); }
  .usage .win { display: grid; grid-template-columns: 52px 1fr; gap: 1px 8px; align-items: center; margin: 3px 0; }
  .usage .bar { height: 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  .usage .bar i { display: block; height: 100%; background: #4f9a6b; }
  .usage .bar i.warn { background: #e2a72e; } .usage .bar i.crit { background: var(--err); }
  .usage .sub2 { grid-column: 2; color: var(--muted); font-size: 11px; }
  .usage .none { color: var(--muted); font-size: 11px; }
  @media (max-width: 760px) { .usage { display: none; } }
  .av-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .av-inline { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; margin-right: 4px; }
  .empty .big .av-img { width: 64px; height: 64px; margin: 0 auto; }
  /* 頭像選擇器 */
  .av-pick { width: 64px; height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); font-size: 22px;
    cursor: pointer; display: grid; place-items: center; padding: 3px; }
  .av-pick .av-img { width: 34px; height: 34px; }
  .av-pick:hover { border-color: var(--accent); }
  .av-panel { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); display: none; }
  .av-panel.open { display: block; }
  .av-panel h4 { margin: 6px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .av-grid { display: flex; flex-wrap: wrap; gap: 2px; }
  .av-grid button { border: 0; background: none; font-size: 22px; width: 38px; height: 38px; padding: 0; border-radius: 8px; }
  .av-grid button:hover { background: var(--panel); }
  .av-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .av-tools input[type=text] { width: 90px; text-align: center; font-size: 18px; padding: 4px; }
  .av-drop { flex: 1; min-width: 180px; border: 1px dashed var(--line); border-radius: 9px; padding: 8px; font-size: 12px;
    color: var(--muted); text-align: center; }
  .av-drop.over { border-color: var(--accent); color: var(--accent); }
  .ver { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .side .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  textarea:disabled { opacity: .6; }

  /* 新增 / 設定 */
  .agent .gear { position: absolute; right: 8px; bottom: 8px; border: 0; background: none; padding: 2px 4px; font-size: 13px;
    opacity: 0; cursor: pointer; border-radius: 6px; }
  .agent:hover .gear, .agent.active .gear { opacity: .7; }
  .agent .gear:hover { opacity: 1; background: var(--bg); }
  .add-card { justify-content: center; color: var(--muted); border: 1px dashed var(--line) !important; font-size: 14px; }
  .add-card:hover { color: var(--accent); border-color: var(--accent) !important; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-start; justify-content: center;
    z-index: 20; overflow-y: auto; padding: 32px 12px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(640px, 100%); padding: 20px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal .lead { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .help { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; outline: none; min-width: 0; }
  .field textarea { resize: vertical; min-height: 110px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .namerow { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
  .namerow input:first-child { text-align: center; font-size: 20px; padding: 3px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 0; }
  .checks label { font-weight: 400; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .checks.disabled { opacity: .45; pointer-events: none; }
  .opt { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .tpl { display: flex; flex-wrap: wrap; gap: 6px; }
  .tpl button { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions .spacer { flex: 1; }
  @media (max-width: 760px) { .fgrid { grid-template-columns: 1fr; } .agent .gear { opacity: .7; } }
  .stale { background: #e2a72e; color: #2b2924; font-size: 13px; padding: 8px 16px; text-align: center; display: none; }
  .stale.show { display: block; }
  /* 任務面板 */
  .taskbar { border-bottom: 1px solid var(--line); background: var(--panel); padding: 10px 16px; display: none; max-height: 45vh; overflow-y: auto; }
  .taskbar.show { display: block; }
  .tb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-title { font-weight: 600; }
  .tb-hint { color: var(--muted); font-size: 13px; }
  .tb-badge { font-size: 12px; padding: 1px 8px; border-radius: 20px; background: var(--bg); border: 1px solid var(--line); }
  .tb-badge.running { color: #2f7d4f; border-color: #2f7d4f; } .tb-badge.awaiting_approval, .tb-badge.waiting_user { color: #b07a10; border-color: #e2a72e; background: #fff6e0; }
  .tb-badge.error { color: var(--err); border-color: var(--err); } .tb-badge.done { color: var(--user); }
  .spacer { flex: 1; }
  .pipe { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .pipe .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .pipe .chip .av-mini { width: 20px; height: 20px; display: grid; place-items: center; font-size: 13px; }
  .pipe .chip.done { color: var(--text); } .pipe .chip.cur { color: var(--text); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .pipe .arr { color: var(--muted); }
  .tb-card { margin-top: 10px; border: 1px solid #e2a72e; background: #fffaf0; border-radius: 12px; padding: 10px 12px; }
  @media (prefers-color-scheme: dark) { .tb-card { background: #2c2618; } .tb-badge.awaiting_approval, .tb-badge.waiting_user { background: #2c2618; } }
  .tb-card .md { max-height: 220px; overflow-y: auto; font-size: 14px; margin: 6px 0; }
  .tb-card textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; resize: vertical; }
  .tb-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .changes { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--tool); white-space: pre-wrap; }
  .tagline { font-size: 11px; color: var(--accent); margin-right: 4px; }
  /* 流程編輯器 */
  .stage { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
  .stage-head { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 8px; align-items: center; }
  .stage-head .num { font-weight: 700; color: var(--accent); text-align: center; }
  .stage .field { margin-top: 8px; }
  .stage .field input, .stage .field select, .stage .field textarea, .stage-head input, .stage-head select { background: var(--panel); }
  .stage-head input, .stage-head select { font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; min-width: 0; }
  .stage .field textarea { min-height: 54px; }
  .stage .mini { display: flex; gap: 4px; } .stage .mini button { padding: 3px 8px; font-size: 13px; }
  .flow-preview { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; padding: 8px 10px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
  .flow-preview .back { color: var(--muted); font-size: 12px; width: 100%; }
  .modal.wide { width: min(820px, 100%); }
  .tlist { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
  .tlist button { text-align: left; display: flex; gap: 8px; align-items: center; }
  /* 附件 */
  .attach-btn { padding: 6px 10px; font-size: 16px; align-self: flex-end; }
  .chips { max-width: 900px; margin: 0 auto 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip-file { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 4px 3px 10px; border-radius: 20px;
    background: var(--accent-soft); border: 1px solid var(--line); max-width: 100%; }
  .chip-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .chip-file button { border: 0; background: none; padding: 0 6px; font-size: 13px; cursor: pointer; }
  .chip-file.up { opacity: .6; }
  .main { position: relative; }
  .dropzone { position: absolute; inset: 0; background: rgba(200,100,59,.10); border: 3px dashed var(--accent); border-radius: 12px; z-index: 10;
    display: none; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none; }
  .dropzone.show { display: flex; }
  /* Telegram */
  .tg-line { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .tg-line:hover { color: var(--accent); }
  .tg-dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa39a; flex: none; }
  .tg-dot.connected { background: #4f9a6b; } .tg-dot.error { background: var(--err); } .tg-dot.connecting { background: #e2a72e; }
  .tg-step { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .tg-step h3 { margin: 0 0 8px; font-size: 15px; }
  .tg-code { font: 700 34px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 8px; color: var(--accent); margin: 6px 0; }
  .tg-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tg-row input[type=password], .tg-row input[type=text] { flex: 1; min-width: 220px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
  /* 排隊與插話 */
  .qline { font-size: 12px; color: #b07a10; }
  .row.queued .bubble { opacity: .65; border-style: dashed; }
  .modebar { max-width: 900px; margin: 0 auto 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
  .modebar:empty { display: none; }
  .modebar button { font-size: 12.5px; padding: 3px 10px; border-radius: 20px; }
  .modebar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modebar .help { margin-left: 4px; }
  #stopBtn { display: none; }
  .dirrow { display: grid; grid-template-columns: 1fr 130px auto; gap: 6px; margin-bottom: 6px; }
  .dirrow input, .dirrow select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; min-width: 0; }
  .dirrow button { padding: 4px 10px; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--err); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 13px; display: none; z-index: 9; }

  /* 手機：側邊欄變成上方橫向列 */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .side h1 { display: none; }
    .agents { flex-direction: row; overflow-x: auto; padding: 8px; }
    .agent { flex: none; padding: 6px 10px; }
    .agent .role { display: none; }
    .bubble { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="stale" id="stale"></div>
<div class="app">
  <aside class="side">
    <h1>💬 Agent Chat <span id="ver" class="ver"></span></h1>
    <div class="agents" id="agents"></div>
    <div class="usage" id="usage"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="title" id="title">—</div>
      <button id="settingsBtn">⚙️ 設定</button>
      <button id="resetBtn" title="清空這個成員的對話，下一句會重新開始">新對話</button>
    </div>
    <div class="taskbar" id="taskbar"></div>
    <div class="msgs" id="msgs"></div>
    <div class="dropzone" id="dropzone">放開以附加檔案 📎</div>
    <div class="composer">
      <div class="modebar" id="modebar"></div>
      <div class="chips" id="chips"></div>
      <div class="box">
        <button class="attach-btn" id="attachBtn" title="附加檔案（也可以直接拖曳或 Ctrl+V 貼上）">📎</button>
        <input type="file" id="attachInput" multiple style="display:none">
        <textarea id="input" rows="1" placeholder="輸入訊息…"></textarea>
        <button class="danger" id="stopBtn" title="停止">⏹</button>
        <button class="primary" id="sendBtn">送出</button>
      </div>
      <div class="hint">Enter 送出 · Shift+Enter 換行 · 檔案可以拖曳進來或 Ctrl+V 貼上 · 成員之間用 @名字 互相呼叫</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
// ---- token（對外開放時用；網址帶 ?token=xxx 一次即可，會記在這台裝置）----
const qs = new URLSearchParams(location.search);
let TOKEN = qs.get('token') || '';

async function api(path, opts = {}) {

}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtTime(ts) {

  const d = new Date(ts), now = new Date(), p = (n) => String(n).padStart(2, '0');
  const t = p(d.getHours()) + ':' + p(d.getMinutes());
  return d.toDateString() === now.toDateString() ? t : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
}

// ---- Markdown 與本機圖片/影片 ----
function renderMarkdown(text, agentId) {
  let html;
  try { html = DOMPurify.sanitize(marked.parse(text, { breaks: true })); }
  catch { html = '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>'; }
  const div = document.createElement('div');
  div.className = 'md';
  div.innerHTML = html;
  const isRemote = (s) => /^(https?:|data:|blob:)/i.test(s);
  const local = (s) => withToken('/api/file?agent=' + encodeURIComponent(agentId) + '&p=' + encodeURIComponent(decodeURI(s)));
  div.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src') || '';
    if (/\.(mp4|webm|mov)$/i.test(src)) { img.replaceWith(makeMedia('video', isRemote(src) ? src : local(src))); return; }
    if (!isRemote(src)) img.src = local(src);
    img.loading = 'lazy';
  });
  div.querySelectorAll('a').forEach((a) => {
    const href = a.getAttribute('href') || '';
    a.target = '_blank'; a.rel = 'noopener';
    const kind = /\.(mp4|webm|mov)$/i.test(href) ? 'video' : /\.(mp3|wav|ogg|m4a)$/i.test(href) ? 'audio' : null;
    if (kind) a.after(makeMedia(kind, isRemote(href) ? href : local(href)));
    else if (href && !isRemote(href) && !href.startsWith('#') && !href.startsWith('mailto:')) a.href = local(href);
  });
  return div;
}
function makeMedia(tag, src) { const m = document.createElement(tag); m.controls = true; m.src = src; m.preload = 'metadata'; return m; }

function renderSegment(seg, agentId) {

  d.textContent = seg.text;
  return d;
}

function addBotRow(segments, meta, live, agentId, ts) {

const nearBottom = () => { const m = $('msgs'); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; };
const scrollDown = (force) => { const m = $('msgs'); if (force || nearBottom()) m.scrollTop = m.scrollHeight; };

async function selectAgent(id) {
  if (id !== current && typeof ATTACH !== 'undefined' && ATTACH.length) { ATTACH = []; renderChips(); }
  current = id; unread.delete(id); liveBubbles.clear();
  try { localStorage.setItem('agentchat_current', id); } catch {}
  renderAgents(); updateTop();
  const msgs = $('msgs'); msgs.innerHTML = '';
  const ids = id === ALL ? agents.map((a) => a.id) : [id];
  let data;
  try { data = await Promise.all(ids.map((x) => api('/api/history/' + encodeURIComponent(x)))); }
  catch (e) { toast(e.message); return; }
  if (current !== id) return;

  const items = [];
  ids.forEach((aid, k) => data[k].history.forEach((m, n) => items.push({ ...m, agentId: aid, n })));
  items.sort((x, y) => (x.ts - y.ts) || (x.n - y.n));
  if (!items.length && !data.some((d) => d.live)) {
    const a = agentOf(id);
    msgs.innerHTML = id === ALL
      ? '<div class="empty"><div class="big">👥</div>還沒有任何對話</div>'
      : `<div class="empty"><div class="big">${avatarHTML(a.avatar)}</div>跟 ${esc(a.name)} 打聲招呼吧</div>`;
  }
  for (const m of items) m.role === 'user' ? addUserRow(m, m.agentId) : addBotRow(m.segments, m.meta, false, m.agentId, m.ts);
  ids.forEach((aid, k) => { if (data[k].live) addBotRow(data[k].live, '', true, aid); });
  if (id !== ALL) renderQueued(data[0].queue);
  scrollDown(true);
  if (id !== ALL) $('input').focus();
}

// 送出時把附件路徑附在訊息後面，請成員讀取
function composeText() {
  const done = ATTACH.filter((x) => x.path);
  if (ATTACH.some((x) => !x.path)) { toast('檔案還在上傳，請稍等'); return null; }
  let text = $('input').value.trim();
  if (done.length) {
    text = (text || '請看附件。') + '\n\n📎 附件（已存到你的工作資料夾，請先讀取）：\n' + done.map((x) => '- ' + x.path).join('\n');
  }
  return text;
}
function clearAttach() { ATTACH = []; renderChips(); }

async function send() {
  const raw = $('input').value.trim();
  const text = composeText(); if (text === null || !text) return;
  const mode = sendMode || 'send';
  const t = TASKS && TASKS.active;
  const done = () => { $('input').value = ''; autoGrow(); clearAttach(); };
  try {
    if (mode === 'task') {
      done(); await api('/api/tasks', { method: 'POST', body: JSON.stringify({ goal: text }) }); toast('✅ 任務開始');
    } else if (mode === 'reply') {
      done(); await api('/api/tasks/' + t.id + '/reply', { method: 'POST', body: JSON.stringify({ text }) });
    } else if (mode === 'note') {
      done(); await api('/api/tasks/' + t.id + '/note', { method: 'POST', body: JSON.stringify({ text }) }); toast('📌 已加入任務指示，之後每一輪都會看到');
    } else if (mode === 'now') {
      const w = current === ALL ? workingAgent() : agentOf(current);
      if (!w) { toast('目前沒有成員在工作'); return; }
      done();
      const r = await api('/api/interject/' + w.id, { method: 'POST', body: JSON.stringify({ text }) });
      toast(r.result === 'interrupted' ? '⚡ 已插話：' + w.name + ' 會帶著你的指示接著做' : '✅ 已送出');
    } else {
      const a = agentOf(current); if (!a) return;
      done();
      const r = await api('/api/chat/' + a.id, { method: 'POST', body: JSON.stringify({ text }) });
      if (r.cc && r.cc.length) toast('📢 也同時交給 ' + r.cc.join('、'));
      else if (r.queued) toast('📢 已排隊，輪到時會自動開始');
    }
  } catch (e) { toast(e.message); if (raw && !$('input').value) $('input').value = raw; }
}

    const item = { name: f.name || 'pasted', path: null, agent: target };

  main.addEventListener('dragenter', (e) => { if (!hasFiles(e) || $('modalBg').classList.contains('open')) return; e.preventDefault(); depth++; dz.classList.add('show'); });
  main.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  main.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; dz.classList.remove('show'); } });
  main.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; dz.classList.remove('show');
    if (!$('modalBg').classList.contains('open')) uploadFiles(e.dataTransfer.files);
  });
}

// 圖片裁成正方形、縮成 128×128 PNG
function squareAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const size = 128, side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('讀不到這張圖')); };
    img.src = url;
  });
}

async function openTeamForm() {

        <span class="help">勾選的成員同一時間只有一位在動手，其他的排隊。沒勾的成員不受限制，例如負責環境更新的成員可以隨時工作。</span></div>
      <div class="field full"><label>流程預覽</label><div class="flow-preview" id="w_preview"></div></div>

    </div>
    <div class="modal-actions">
      <span class="help">修改流程不影響進行中的任務已完成的部分；下一輪交接就會套用新流程。</span>
      <span class="spacer"></span>
      <button id="t_cancel">取消</button>
      <button class="primary" id="t_save">儲存</button>
    </div>`);
  $('modal').classList.add('wide');

  function preview() {
    if (!wf.stages.length) { $('w_preview').innerHTML = '<span class="help">還沒有階段</span>'; return; }
    const main = [], back = [];
    wf.stages.forEach((st, i) => {
      const o = members.find((m) => m.id === st.owner);
      main.push(`<span class="chip">${esc((o ? (isImgAv(o.avatar) ? '👤' : o.avatar || '🤖') + ' ' : '❓ ') + st.name)}${st.approval ? ' 🔒' : ''}</span>`);
      for (const n of st.next) {
        const j = wf.stages.findIndex((x) => x.id === n);
        if (j !== i + 1) back.push(st.name + ' → ' + sName(n));

    });
    $('w_preview').innerHTML = main.join('<span class="arr">→</span>') +

          if (k === 'name') { renderNextLabels(); }

        } else {
          const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= wf.stages.length) return;

    const t = FLOW_TEMPLATE();

    t.stages[0].owner = pm; t.stages[1].owner = coder; t.stages[2].owner = qa; t.stages[3].owner = pm;
    wf.name = t.name; wf.stages = t.stages; $('w_name').value = t.name;

  $('t_cancel').onclick = closeModal;

      closeModal(); toast('✅ 工作流程已儲存');
    } catch (e) { toast(e.message); }

function renderQueued(q) {

  if (!q || !q.items.length) return;
  clearEmpty();
  const wait = q.waitingOn && q.waitingOn !== current && agentOf(q.waitingOn);
  for (const it of q.items) {
    const from = it.from && agentOf(it.from);
    const row = document.createElement('div'); row.className = 'row user queued' + (from ? ' relay' : '');
    const col = document.createElement('div'); col.className = 'col';
    const w = document.createElement('div'); w.className = 'who';
    w.textContent = '🕒 排隊中' + (wait ? '：等 ' + label(wait) + ' 做完就開始' : q.waitingOn === current ? '：等它這輪做完' : '') + (from ? '（來自 ' + label(from) + '）' : '');
    const b = document.createElement('div'); b.className = 'bubble';
    if (from) b.appendChild(renderMarkdown(it.text, current)); else b.textContent = it.text;
    col.appendChild(w); col.appendChild(b); row.appendChild(col); msgs.appendChild(row);
  }

const WIN_LABEL = { '5h': '5 小時', week: '每週', week_opus: '每週 Opus', week_sonnet: '每週 Sonnet' };
let USAGE = null;
function fmtReset(sec) {
  if (!sec) return '';
  const ms = sec * 1000 - Date.now();
  if (ms <= 0) return '已重置';
  const h = Math.floor(ms / 3600e3), m = Math.floor((ms % 3600e3) / 60e3);
  if (h < 24) return (h ? h + ' 小時 ' : '') + m + ' 分後重置';
  const d = new Date(sec * 1000), p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' 重置';
}
function renderUsage() {
  const el = $('usage'); if (!el) return;
  const block = (title, u) => {
    const wins = Object.entries((u && u.windows) || {}).sort(([a], [b]) => (a === '5h' ? -1 : b === '5h' ? 1 : a.localeCompare(b)));
    let h = `<div class="eng">${title}<small>${u && u.updatedAt ? '更新 ' + fmtTime(u.updatedAt) : ''}</small></div>`;
    if (!wins.length) return h + '<div class="none">還沒有資料：成員執行一次後就會出現，或按「查詢」</div>';
    for (const [k, w] of wins) {
      const reset = w.resetsAt && w.resetsAt * 1000 < Date.now();
      const used = reset ? 0 : Math.min(100, Math.max(0, w.pct));
      const cls = used >= 90 ? 'crit' : used >= 70 ? 'warn' : '';
      h += `<div class="win"><span>${esc(WIN_LABEL[k] || k)}</span><div class="bar"><i class="${cls}" style="width:${used}%"></i></div>
        <span class="sub2">剩 ${Math.round(100 - used)}%${reset ? '（已重置）' : w.resetsAt ? ' · ' + fmtReset(w.resetsAt) : ''}</span></div>`;
    }
    return h;
  };
  el.innerHTML = `<div class="uh">用量額度<button id="usageBtn" title="送出一個極小的請求，取得最新額度">${USAGE && USAGE.probing ? '查詢中…' : '🔄 查詢'}</button></div>` +
    block('Claude', USAGE && USAGE.claude) + block('Codex', USAGE && USAGE.codex) + tgLineHTML();
  $('tgLine').onclick = openTelegramForm;
  $('usageBtn').onclick = async () => {
    $('usageBtn').textContent = '查詢中…';
    try { await api('/api/usage/refresh', { method: 'POST' }); } catch (e) { toast(e.message); }
  };
}
async function loadUsage() { try { USAGE = await api('/api/usage'); } catch { return; } renderUsage(); }

}
function renderTelegramForm() {
  const t = TG; if (!t || !$('tgModal')) return;
  const keepToken = $('tg_token') ? $('tg_token').value : '';
  const st = t.hasToken ? t.state : 'off';
  const bot = t.username ? '@' + t.username : '你的 bot';
  const pair = t.pairing;
  $('tgModal').innerHTML = `
    <h2>📱 Telegram 遙控</h2>
    <p class="lead">設定好之後，可以用手機的 Telegram 派工、核准交接、查看進度與用量。token 只存在這台電腦的 agents.json，不會上傳到 GitHub。</p>
    <div class="tg-step">
      <h3>1. 連線 bot</h3>
      <div class="tg-row" style="margin-bottom:8px"><span class="tg-dot ${st}"></span><b>${esc(TG_STATE[st])}${t.username ? '：@' + esc(t.username) : ''}</b>
        ${t.error ? '<span class="seg-error">' + esc(t.error) + '</span>' : ''}</div>
      ${t.fromEnv ? '<p class="help">目前使用環境變數 TELEGRAM_BOT_TOKEN 的 token。</p>' : `
      <div class="tg-row">
        <input type="password" id="tg_token" placeholder="${t.hasToken ? '已設定（' + esc(t.tokenHint) + '），要換新的才需要貼' : '貼上 BotFather 給的 token，例如 123456789:ABC…'}" autocomplete="off">
        <button class="primary" id="tg_save">${t.hasToken ? '更新並重新連線' : '儲存並連線'}</button>
      </div>
      <p class="help">在 Telegram 的 @BotFather 選你的 bot，按「Copy」複製 token，再貼到這裡。</p>`}
    </div>
    <div class="tg-step" style="${st === 'connected' ? '' : 'opacity:.5;pointer-events:none'}">
      <h3>2. 配對你的手機</h3>
      ${t.allowedCount ? `<p>✅ 已配對 <b>${t.allowedCount}</b> 個 Telegram 帳號。到 Telegram 傳 <code>/help</code> 給 ${esc(bot)} 試試看。</p>` : '<p class="help">配對後，只有你的帳號能下指令，其他人傳訊息只會被拒絕。</p>'}
      ${pair ? `<p>在手機打開 <a href="https://t.me/${esc(t.username)}" target="_blank" rel="noopener">${esc(bot)}</a>，把這 6 個數字傳給它：</p>
        <div class="tg-code">${esc(pair.code)}</div><p class="help">10 分鐘內有效。配對成功後這裡會自動更新。</p>`
        : `<div class="tg-row"><button class="primary" id="tg_pair">${t.allowedCount ? '再配對一個帳號' : '產生配對碼'}</button>
           ${t.allowedCount ? '<button id="tg_clear">移除所有已配對的帳號</button>' : ''}</div>`}
    </div>
    <div class="tg-step">
      <h3>3. 其他設定</h3>
      <div class="tg-row">從 Telegram 直接打字時，預設交給
        <select id="tg_default">${agents.map((a) => `<option value="${esc(a.id)}" ${a.id === t.defaultAgent ? 'selected' : ''}>${esc(label(a))}</option>`).join('')}</select></div>
      <label class="opt" style="margin-top:8px"><input type="checkbox" id="tg_enabled" ${t.enabled ? 'checked' : ''}> 啟用 Telegram 遙控</label>
    </div>
    <div class="modal-actions"><span class="spacer"></span><button id="tg_close">關閉</button></div>`;
  if ($('tg_token')) $('tg_token').value = keepToken;
  const put = async (body) => { try { TG = await api('/api/telegram', { method: 'PUT', body: JSON.stringify(body) }); renderTelegramForm(); renderUsage(); } catch (e) { toast(e.message); } };
  if ($('tg_save')) $('tg_save').onclick = () => {
    const v = $('tg_token').value.trim(); if (!v) { toast('請先貼上 token'); return; }
    $('tg_token').value = ''; put({ botToken: v, enabled: true });
  };
  if ($('tg_pair')) $('tg_pair').onclick = async () => { try { await api('/api/telegram/pair', { method: 'POST' }); loadTelegram(); } catch (e) { toast(e.message); } };
  if ($('tg_clear')) $('tg_clear').onclick = async () => {
    if (!confirm('移除所有已配對的帳號？之後要重新配對才能用 Telegram 遙控。')) return;
    try { TG = await api('/api/telegram/clear', { method: 'POST' }); renderTelegramForm(); renderUsage(); } catch (e) { toast(e.message); }
  };
  $('tg_default').onchange = (e) => put({ defaultAgent: e.target.value });
  $('tg_enabled').onchange = (e) => put({ enabled: e.target.checked });
  $('tg_close').onclick = closeModal;
}

// ---- 即時事件 ----
function connectEvents() {
  const es = new EventSource(withToken('/api/events'));
  es.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.kind === 'agents-changed') { refreshAgents(); loadWorkflow().then(() => current === ALL && updateTop()); return; }
    if (ev.kind === 'usage') { loadUsage(); return; }
    if (ev.kind === 'telegram') { loadTelegram(); return; }
    if (ev.kind === 'task') { loadTasks(); return; }
    if (ev.kind === 'queue') { refreshQueue(); return; }
    const a = agentOf(ev.agentId); if (!a) return;
    if (ev.kind === 'busy') { a.busy = ev.busy; renderAgents(); updateTop(); return; }
    if (ev.kind === 'reset') { if (shown(ev.agentId)) selectAgent(current); return; }
    if (ev.kind === 'queued') { if (shown(ev.agentId)) toast(a.name + ' 忙碌中，同事的訊息已排隊'); return; }
    if (!shown(ev.agentId)) { if (['user', 'segment', 'done'].includes(ev.kind)) { unread.add(ev.agentId); renderAgents(); } return; }
    const stick = nearBottom();
    if (ev.kind === 'user') { addUserRow({ text: ev.text, from: ev.from, via: ev.via, cc: ev.cc, taskId: ev.taskId, system: ev.system }, ev.agentId); addBotRow([], '', true, ev.agentId); scrollDown(true); return; }
    if (ev.kind === 'segment') liveAppend(ev.agentId, ev.segment);
    if (ev.kind === 'done') liveFinish(ev.agentId, ev.meta);
    if (stick) scrollDown(true);
  };
  es.onerror = () => { es.close(); setTimeout(() => { connectEvents(); if (current) selectAgent(current); }, 2000); };
}

(async function init() {
  try { agents = await api('/api/agents'); }
  catch (e) { $('msgs').innerHTML = '<div class="empty">連不上伺服器：' + esc(e.message) + '<br>如果有設定 token，網址要加上 ?token=你的密碼</div>'; return; }
  let saved = null; try { saved = localStorage.getItem('agentchat_current'); } catch {}
  // 網頁檔案 git pull 後馬上是新的，但伺服器要重開才會更新；版本不一致就提醒
  api('/api/info').then((i) => {
    $('ver').textContent = 'v' + i.version;
    if (i.version !== UI_VERSION) staleWarning(i.version);
  }).catch(() => staleWarning('舊版'));
  connectEvents();
  loadUsage();
  loadTelegram();
  await Promise.all([loadWorkflow(), loadTasks()]);
  selectAgent(saved === ALL || agents.some((a) => a.id === saved) ? saved : agents[0].id);
})();
</script>
