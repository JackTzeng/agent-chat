<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Chat</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/office.js"></script>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf9; --line: #e6e1d6; --text: #2b2924; --muted: #8a857a;
    --accent: #c8643b; --accent-soft: #f6e4da; --user: #2f5d50; --tool: #6f6a60; --err: #b3261e;
    --claude: #c8643b; --codex: #3d6fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --panel: #24221f; --line: #36332e; --text: #ece7dd; --muted: #9c968a;
      --accent-soft: #3a2a22; --user: #3f7a69; --tool: #a59e91; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .app { display: grid; grid-template-columns: 260px 1fr; flex: 1; min-height: 0; }

  /* 側邊欄 */
  .side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side h1 { font-size: 15px; margin: 0; padding: 16px 16px 10px; letter-spacing: .5px; }
  .agents { overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .agent { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; position: relative; user-select: none; }
  .agent:hover { background: var(--bg); }
  .agent.active { background: var(--accent-soft); border-color: var(--line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
    background: var(--bg); border: 1px solid var(--line); flex: none; position: relative; }
  .agent .name { font-weight: 600; }
  .agent .role { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; color: #fff; margin-left: 6px; vertical-align: 1px; }
  .badge.claude { background: var(--claude); } .badge.codex { background: var(--codex); } .badge.agy { background: #4285f4; }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--panel); background: #9aa39a; }
  .agent.busy .dot { background: #e2a72e; animation: pulse 1s infinite; }
  .unread { position: absolute; right: 10px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
  .agent.has-unread .unread { display: block; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 聊天區 */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 9px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty .big { font-size: 48px; }
  .row { display: flex; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 32px; height: 32px; font-size: 17px; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: min(720px, 85%); overflow-wrap: anywhere; min-width: 0; }
  .row.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .row.bot .bubble { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .seg-tool { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--tool); padding: 2px 0; }
  .seg-error { color: var(--err); white-space: pre-wrap; font-size: 13.5px; }
  .seg-text + .seg-tool, .seg-tool + .seg-text { margin-top: 6px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .thinking { color: var(--muted); font-size: 13px; animation: pulse 1.2s infinite; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; }
  .md :not(pre) > code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  .md img, .md video { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 6px 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md a { color: var(--accent); }

  .composer { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  .composer .box { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px; max-height: 40vh; min-height: 42px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .hint { max-width: 900px; margin: 4px auto 0; font-size: 11px; color: var(--muted); }
  .row.relay .bubble { background: var(--accent-soft); color: var(--text); border: 1px dashed var(--accent); white-space: normal; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .row.user .who { text-align: right; }
  .col { display: flex; flex-direction: column; min-width: 0; max-width: min(720px, 85%); }
  .col .bubble { max-width: 100%; }
  .row.user .col { align-items: flex-end; }
  .sysline { text-align: center; font-size: 12px; color: var(--muted); }
  .sysline span { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; }
  .agent.all .avatar { background: var(--accent-soft); }
  /* 用量額度 */
  .usage { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12px; }
  .usage .uh { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .usage .uh button { padding: 1px 8px; font-size: 12px; border-radius: 7px; }
  .usage .eng { font-weight: 600; margin: 6px 0 2px; display: flex; justify-content: space-between; }
  .usage .eng small { font-weight: 400; color: var(--muted); }
  .usage .win { display: grid; grid-template-columns: 52px 1fr; gap: 1px 8px; align-items: center; margin: 3px 0; }
  .usage .bar { height: 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  .usage .bar i { display: block; height: 100%; background: #4f9a6b; }
  .usage .bar i.warn { background: #e2a72e; } .usage .bar i.crit { background: var(--err); }
  .usage .sub2 { grid-column: 2; color: var(--muted); font-size: 11px; }
  .usage .none { color: var(--muted); font-size: 11px; }
  @media (max-width: 760px) { .usage { display: none; } }
  .cli-tabs { display: flex; gap: 6px; align-items: center; margin: 6px 0 10px; } .cli-tabs .spacer { flex: 1; } .cli-tabs small { color: var(--muted); }
  .cli-body { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; } .cli-ver { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .cli-body .hn-item .grow { white-space: normal; }
  input.secret { -webkit-text-security: disc; }
  .ln-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; } .ln-guide { margin: 8px 0; } .ln-guide ol { padding-left: 20px; margin: 6px 0; line-height: 1.7; } .ln-guide li { margin-bottom: 6px; }
  .ln-check { margin: 8px 0; font-size: 13px; line-height: 1.7; } .ln-code { font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 0 8px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sk-h { margin: 14px 0 6px; font-size: 14px; } .sk-desc { margin: 4px 0; font-size: 13px; } .sk-bad { color: var(--err); margin: 4px 0; font-size: 13px; } .sk-ok { color: #4f9a6b; margin: 4px 0; font-size: 13px; }
  .sk-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; } .sk-row label { font-size: 13px; color: var(--muted); }
  .sk-files { font-family: ui-monospace, monospace; font-size: 12px; max-height: 160px; overflow-y: auto; padding: 4px 0; } .sk-card .acts button { white-space: nowrap; }
  .cli-chip a { color: var(--muted); text-decoration: none; margin-left: 2px; } .cli-chip a:hover { color: var(--err); }
  .cli-chip { display: inline-block; padding: 1px 8px; margin: 2px 0; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
  .cli-tbl { width: 100%; border-collapse: collapse; font-size: 13px; } .cli-tbl th, .cli-tbl td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .av-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .av-inline { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; margin-right: 4px; }
  .empty .big .av-img { width: 64px; height: 64px; margin: 0 auto; }
  /* 頭像選擇器 */
  .av-pick { width: 64px; height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); font-size: 22px;
    cursor: pointer; display: grid; place-items: center; padding: 3px; }
  .av-pick .av-img { width: 34px; height: 34px; }
  .av-pick:hover { border-color: var(--accent); }
  .av-panel { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); display: none; }
  .av-panel.open { display: block; }
  .av-panel h4 { margin: 6px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .av-grid { display: flex; flex-wrap: wrap; gap: 2px; }
  .av-grid button { border: 0; background: none; font-size: 22px; width: 38px; height: 38px; padding: 0; border-radius: 8px; }
  .av-grid button:hover { background: var(--panel); }
  .av-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .av-tools input[type=text] { width: 90px; text-align: center; font-size: 18px; padding: 4px; }
  .av-drop { flex: 1; min-width: 180px; border: 1px dashed var(--line); border-radius: 9px; padding: 8px; font-size: 12px;
    color: var(--muted); text-align: center; }
  .av-drop.over { border-color: var(--accent); color: var(--accent); }
  .ver { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .side .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .team-h { display: flex; align-items: center; gap: 6px; margin: 10px 8px 2px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; letter-spacing: .02em; }
  .team-h:hover { color: var(--text); }
  .team-h .team-st { margin-left: auto; font-weight: 600; }
  .team-h.solo { cursor: default; }
  .team-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .team-tabs button { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .team-tabs button.on { background: var(--accent); color: #fff; border-color: transparent; }
  textarea:disabled { opacity: .6; }

  /* 新增 / 設定 */
  .agent .gear { position: absolute; right: 8px; bottom: 8px; border: 0; background: none; padding: 2px 4px; font-size: 13px;
    opacity: 0; cursor: pointer; border-radius: 6px; }
  .agent:hover .gear, .agent.active .gear { opacity: .7; }
  .agent .gear:hover { opacity: 1; background: var(--bg); }
  .add-card { justify-content: center; color: var(--muted); border: 1px dashed var(--line) !important; font-size: 14px; }
  .add-card:hover { color: var(--accent); border-color: var(--accent) !important; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-start; justify-content: center;
    z-index: 20; overflow-y: auto; padding: 32px 12px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(640px, 100%); padding: 20px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal .lead { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .help { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; outline: none; min-width: 0; }
  .field textarea { resize: vertical; min-height: 110px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .namerow { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
  .namerow input:first-child { text-align: center; font-size: 20px; padding: 3px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 0; }
  .checks label { font-weight: 400; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .checks.disabled { opacity: .45; pointer-events: none; }
  .opt { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .tpl { display: flex; flex-wrap: wrap; gap: 6px; }
  .tpl button { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions .spacer { flex: 1; }
  @media (max-width: 760px) { .fgrid { grid-template-columns: 1fr; } .agent .gear { opacity: .7; } }
  .stale { background: #e2a72e; color: #2b2924; font-size: 13px; padding: 8px 16px; text-align: center; display: none; }
  .stale.show { display: block; }
  /* 任務面板 */
  .taskbar { border-bottom: 1px solid var(--line); background: var(--panel); padding: 10px 16px; display: none; max-height: 45vh; overflow-y: auto; }
  .taskbar.show { display: block; }
  .tb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-title { font-weight: 600; }
  .tb-hint { color: var(--muted); font-size: 13px; }
  .tb-badge { font-size: 12px; padding: 1px 8px; border-radius: 20px; background: var(--bg); border: 1px solid var(--line); }
  .tb-badge.running { color: #2f7d4f; border-color: #2f7d4f; } .tb-badge.awaiting_approval, .tb-badge.waiting_user { color: #b07a10; border-color: #e2a72e; background: #fff6e0; }
  .tb-badge.error { color: var(--err); border-color: var(--err); } .tb-badge.done { color: var(--user); }
  .spacer { flex: 1; }
  .pipe { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .pipe .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .pipe .chip .av-mini { width: 20px; height: 20px; display: grid; place-items: center; font-size: 13px; }
  .pipe .chip.done { color: var(--text); } .pipe .chip.cur { color: var(--text); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .pipe .arr { color: var(--muted); }
  .tb-card { margin-top: 10px; border: 1px solid #e2a72e; background: #fffaf0; border-radius: 12px; padding: 10px 12px; }
  @media (prefers-color-scheme: dark) { .tb-card { background: #2c2618; } .tb-badge.awaiting_approval, .tb-badge.waiting_user { background: #2c2618; } }
  .tb-card .md { max-height: 220px; overflow-y: auto; font-size: 14px; margin: 6px 0; }
  .tb-card textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; resize: vertical; }
  .tb-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .changes { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--tool); white-space: pre-wrap; }
  .tagline { font-size: 11px; color: var(--accent); margin-right: 4px; }
  /* 流程編輯器 */
  .stage { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
  .stage-head { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 8px; align-items: center; }
  .stage-head .num { font-weight: 700; color: var(--accent); text-align: center; }
  .stage .field { margin-top: 8px; }
  .stage .field input, .stage .field select, .stage .field textarea, .stage-head input, .stage-head select { background: var(--panel); }
  .stage-head input, .stage-head select { font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; min-width: 0; }
  .stage .field textarea { min-height: 54px; }
  .stage .mini { display: flex; gap: 4px; } .stage .mini button { padding: 3px 8px; font-size: 13px; }
  .flow-preview { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; padding: 8px 10px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
  .flow-preview .back { color: var(--muted); font-size: 12px; width: 100%; }
  .modal.wide { width: min(820px, 100%); }
  .tlist { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
  .hn-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
  .hn-tabs button.on { background: var(--accent, #4f6bed); color: #fff; border-color: transparent; }
  .hn-dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #e5484d; color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; }
  .hn-list { display: flex; flex-direction: column; gap: 6px; max-height: 52vh; overflow-y: auto; }
  .hn-item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); display: flex; gap: 8px; align-items: flex-start; }
  .hn-item .grow { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .hn-item small { color: var(--muted); display: block; margin-top: 2px; }
  .hn-item.prop { border-color: #e2a72e; }
  .hn-item .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .hn-six { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .hn-six div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; background: var(--bg); }
  .hn-six b { display: block; margin-bottom: 2px; }
  table.hn-t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hn-t th, table.hn-t td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  .hn-add { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .hn-add input { flex: 1; min-width: 180px; }
  .tlist button { text-align: left; display: flex; gap: 8px; align-items: center; }
  /* 附件 */
  .attach-btn { padding: 6px 10px; font-size: 16px; align-self: flex-end; }
  .chips { max-width: 900px; margin: 0 auto 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip-file { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 4px 3px 10px; border-radius: 20px;
    background: var(--accent-soft); border: 1px solid var(--line); max-width: 100%; }
  .chip-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .chip-file button { border: 0; background: none; padding: 0 6px; font-size: 13px; cursor: pointer; }
  .chip-file.up { opacity: .6; }
  .main { position: relative; min-width: 0; overflow: hidden; }
  .dropzone { position: absolute; inset: 0; background: rgba(200,100,59,.10); border: 3px dashed var(--accent); border-radius: 12px; z-index: 10;
    display: none; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none; }
  .dropzone.show { display: flex; }
  /* Telegram */
  .tg-line { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .tg-line:hover { color: var(--accent); }
  .usage .utoggle { cursor: pointer; user-select: none; } .usage .utoggle:hover { color: var(--accent); }

  .diag dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; margin: 0 0 10px; }
  .diag dt { color: var(--muted); } .diag dd { margin: 0; word-break: break-all; }
  .stall { color: var(--err); font-weight: 600; }
  /* 🏢 辦公室 */
  .office { flex: 1; min-height: 0; position: relative; display: none; background: #283048; overflow: hidden; }
  .office.show { display: block; }
  .office-canvas { display: block; image-rendering: pixelated; }
  .office-zoom { position: absolute; right: 12px; top: 12px; background: rgba(20,22,28,.8); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
  .office-tip { position: absolute; display: none; pointer-events: none; background: rgba(255,253,247,.97); color: #3a2f2a; border: 2px solid #3a2f2a;
    border-radius: 10px; padding: 6px 10px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 3; max-width: 220px; }
  .agent.office-card .avatar { background: #f6e4da; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--err); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 13px; display: none; z-index: 9; }

  /* 手機：側邊欄變成上方橫向列 */
  @media (max-width: 760px) {

  }

<body>

</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="modal-bg" id="modal2Bg" style="z-index:30"><div class="modal wide" id="modal2"></div></div>

<script>
// ---- token（對外開放時用；網址帶 ?token=xxx 一次即可，會記在這台裝置）----
// Browser API calls authenticate via HttpOnly session cookie, never through URL/localStorage.
try { localStorage.removeItem('agentchat_token'); } catch {}
if (location.search) history.replaceState(null, '', location.pathname + location.hash);
const withToken = (u) => u;
let UPD_BADGE = false;
let FB_COUNTS = null; // 🐞 錯誤回報各狀態件數（有回報才在側邊欄顯示）
let FB_FILTER = 'todo';
let MD_BADGE = 0; // 📝 待核准的設定檔修改提案數
let OUTBOX_N = 0; // 📮 暫時送不出去、等著重送的通知數（0 就不顯示）
let TIMER_BADGE = 0; // 待核准的排程建議數 // 有新版本時，側邊欄的「⬆️ 更新」顯示「新」

const $ = (id) => document.getElementById(id);
const ALL = '__all';
const OFFICE = '__office';
let officeMode = false;
try { officeMode = localStorage.getItem('agentchat_office') === '1'; } catch {}
const UI_VERSION = '3.36.0'; // 要和 server.js 的 VERSION 一致
let agents = [];
let current = null;
const unread = new Set();
const liveBubbles = new Map(); // agentId -> 正在執行中的回覆泡泡（目前畫面上的）

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  t.style.background = /^(✅|📢)/.test(msg) ? 'var(--user)' : ''; // 成功／通知用綠色，錯誤用紅色
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 3500);
}
async function api(path, opts = {}) {
  const r = await fetch(withToken(path), { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const agentOf = (id) => agents.find((a) => a.id === id);
const isImgAv = (v) => typeof v === 'string' && v.startsWith('img:');
const avText = (a) => (a && a.avatar && !isImgAv(a.avatar) ? a.avatar : '');
const label = (a) => a ? (avText(a) ? avText(a) + ' ' : '') + a.name : '?';
// 頭像 HTML：emoji 或自訂圖片
function avatarHTML(v, cls = 'av-img') {
  if (isImgAv(v)) return `<img class="${cls}" src="${esc(withToken('/api/avatar/' + v.slice(4)))}" alt="">`;
  return esc(v || '🤖');
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date(), p = (n) => String(n).padStart(2, '0');
  const t = p(d.getHours()) + ':' + p(d.getMinutes());
  return d.toDateString() === now.toDateString() ? t : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
}
const shown = (agentId) => current === ALL || current === agentId;

// ---- Markdown 與本機圖片/影片 ----
function renderMarkdown(text, agentId) {
  let html;
  try { html = DOMPurify.sanitize(marked.parse(text, { breaks: true })); }
  catch { html = '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>'; }
  const div = document.createElement('div');
  div.className = 'md';
  div.innerHTML = html;
  const isRemote = (s) => /^(https?:|data:|blob:)/i.test(s);
  const local = (s) => withToken('/api/file?agent=' + encodeURIComponent(agentId) + '&p=' + encodeURIComponent(decodeURI(s)));
  div.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src') || '';
    if (/\.(mp4|webm|mov)$/i.test(src)) { img.replaceWith(makeMedia('video', isRemote(src) ? src : local(src))); return; }
    if (!isRemote(src)) img.src = local(src);
    img.loading = 'lazy';
  });
  div.querySelectorAll('a').forEach((a) => {
    const href = a.getAttribute('href') || '';
    a.target = '_blank'; a.rel = 'noopener';
    const kind = /\.(mp4|webm|mov)$/i.test(href) ? 'video' : /\.(mp3|wav|ogg|m4a)$/i.test(href) ? 'audio' : null;
    if (kind) a.after(makeMedia(kind, isRemote(href) ? href : local(href)));
    else if (href && !isRemote(href) && !href.startsWith('#') && !href.startsWith('mailto:')) a.href = local(href);
  });
  return div;
}
function makeMedia(tag, src) { const m = document.createElement(tag); m.controls = true; m.src = src; m.preload = 'metadata'; return m; }

function renderSegment(seg, agentId) {
  if (seg.type === 'text') { const d = renderMarkdown(seg.text, agentId); d.classList.add('seg-text'); return d; }
  const d = document.createElement('div');
  d.className = seg.type === 'error' ? 'seg-error' : 'seg-tool';
  d.textContent = seg.text;
  return d;
}

// ---- 側邊欄 ----
function agentCard(a, extraClass = '') {
  return `
    <div class="agent ${extraClass} ${a.id === current ? 'active' : ''} ${a.busy ? 'busy' : ''} ${unread.has(a.id) ? 'has-unread' : ''}" data-id="${esc(a.id)}">
      <div class="avatar">${avatarHTML(a.avatar)}<span class="dot"></span></div>
      <div style="min-width:0">
        <div class="name">${esc(a.name)}${a.engine ? `<span class="badge ${esc(a.engine)}">${esc(a.engine)}</span>` : ''}</div>
        <div class="role">${esc(a.role || '')}</div>
        ${a.engine ? `<div class="role">${esc([a.model || '預設模型', a.effort].filter(Boolean).join(' · '))}${a.takeTurns ? ' · <span title="和團隊輪流工作：同一時間只有一位輪流成員在動手">🔁 輪流</span>' : ''}</div>` : ''}
        ${a.rtk ? `<div class="role" title="${a.rtkOn ? '這位 Claude 成員的指令輸出會經過 rtk 精簡' : '已勾選，但還沒找到 rtk（請先安裝），或這位成員不適用'}">🗜 rtk${a.rtkOn ? '' : '（未生效）'}</div>` : ''}
        ${a.extraDirs && a.extraDirs.length ? `<div class="role" title="${esc(a.extraDirs.map((d) => d.path + (d.mode === 'ro' ? '（唯讀）' : '（可讀寫）')).join('\n'))}">📁 +${a.extraDirs.length} 個資料夾</div>` : ''}
        ${a.blocked ? `<div class="role stall" title="${esc(a.blocked)}">⛔ 設定需修正，暫停使用</div>` : ''}
        ${a.agyRisk ? `<div class="role stall" title="${esc(a.agyRisk)}">⚠️ 會執行指令，資料夾在 Agent Chat 裡</div>` : ''}
        ${a.agyOut && a.agyOut > Date.now() ? `<div class="role stall" title="同事轉交、任務、排程暫不交給它；你直接傳訊息會再試一次">🪫 額度用完 · 預計 ${esc(fmtTime(a.agyOut))} 恢復</div>` : ''}
        ${a.standalone ? `<div class="role" title="不進工作流程、不建立任務，訊息直接交給它處理">🧍 獨立成員${a.tgPrefix ? '｜Telegram ' + esc(a.tgPrefix) : ''}${a.tgBot ? '｜專屬 bot' : ''}</div>` : ''}
        ${a.paused ? `<div class="role stall" title="專案暫停中：同事轉交、任務交接、排程都先排隊；你直接傳給它的訊息照樣會處理">⏸ 專案暫停中</div>` : ''}
        ${a.shifting ? '<div class="role">🔄 換班中：正在寫交班筆記</div>' : a.busy && a.runningSince ? `<div class="role ${a.stalled ? 'stall' : ''}">${a.stalled ? '⚠️ 可能卡住 · ' : '⏱ '}工作中 ${esc(ago(a.runningSince))}</div>` : ''}
        ${a.ctx || a.shiftNo > 1 ? `<div class="role ${a.ctx && CFG_H && CFG_H.shiftPercent && a.ctx.pct >= CFG_H.shiftPercent ? 'stall' : ''}" title="這段對話大約用了 ${a.ctx ? Math.round(a.ctx.tokens / 1000) + 'k / ' + Math.round(a.ctx.window / 1000) + 'k tokens' : '—'}；超過 ${CFG_H ? CFG_H.shiftPercent : 40}% 會自動換班">🧠 ${a.ctx ? a.ctx.pct + '%' : '新對話'}${a.shiftNo > 1 ? ' · 第 ' + a.shiftNo + ' 班' : ''}${a.ctx && CFG_H && CFG_H.shiftPercent && a.ctx.pct >= CFG_H.shiftPercent && !a.busy ? ' · 下一輪先換班' : ''}</div>` : ''}
        ${a.queued ? `<div class="qline">🕒 排隊中${a.paused && !a.busy ? '（重啟後才處理）' : a.waitingOn === a.id ? '（等它這輪做完）' : a.waitingOn && agentOf(a.waitingOn) ? '（等 ' + esc(agentOf(a.waitingOn).name) + ' 做完）' : ''}</div>` : ''}
      </div>
      <span class="unread"></span>
      ${a.id !== ALL && a.id !== OFFICE ? `<button class="gear" data-edit="${esc(a.id)}" title="編輯成員">⚙️</button>` : ''}
    </div>`;
}
function renderAgents() {
  const acts = (TASKS && TASKS.actives) || [];
  const allCard = { id: ALL, name: '全員', avatar: '👥', busy: agents.some((a) => a.busy),
    role: acts.length ? acts.map((t) => (STATUS_ICON[t.status] || '') + ' #' + t.id).join('　') + (acts.length > 1 ? '（' + acts.length + ' 件進行中）' : '：' + acts[0].statusText) : '任務、交接與大家的對話' };
  const officeCard = { id: OFFICE, name: '辦公室', avatar: '🏢', role: '看大家在做什麼', busy: allCard.busy };
  // 依小組分區；獨立成員放最後
  const groups = TEAMS.map((tm) => ({ tm, list: agents.filter((a) => !a.standalone && a.team === tm.id) }));
  const loose = agents.filter((a) => !a.standalone && !TEAMS.some((tm) => tm.id === a.team));
  if (loose.length && groups[0]) groups[0].list.push(...loose);
  const solo = agents.filter((a) => a.standalone);
  const teamHead = (tm) => { const t = teamTask(tm.id);
    return `<div class="team-h" data-team="${esc(tm.id)}" title="切換到這個小組的任務與流程"><span>${esc((tm.icon || '🏢') + ' ' + tm.name)}</span>${t ? `<span class="team-st">${STATUS_ICON[t.status] || ''} #${t.id}</span>` : ''}</div>`; };
  $('agents').innerHTML = agentCard(allCard, 'all') + agentCard(officeCard, 'all office-card') + '<div class="sep"></div>' +
    groups.map((g) => (TEAMS.length > 1 || solo.length ? teamHead(g.tm) : '') + g.list.map((a) => agentCard(a)).join('')).join('') +
    (solo.length ? '<div class="team-h solo"><span>🧍 獨立成員</span></div>' + solo.map((a) => agentCard(a)).join('') : '') +
    '<div class="agent add-card" id="addAgent">＋ 新增成員</div>';
  document.querySelectorAll('.team-h[data-team]').forEach((el) => (el.onclick = () => { TEAM_SEL = el.dataset.team; WF = (curTeam() || {}).workflow || null; setOffice(false); selectAgent(ALL); }));
  document.querySelectorAll('.agent[data-id]').forEach((el) => (el.onclick = () => {
    const id = el.dataset.id;
    if (id === OFFICE) { setOffice(true); selectAgent(ALL); }
    else { if (id === ALL) setOffice(false); selectAgent(id); }
  }));
  // 全員 / 辦公室 卡片的選取狀態
  const allEl = document.querySelector('.agent[data-id="' + ALL + '"]'), offEl = document.querySelector('.agent[data-id="' + OFFICE + '"]');
  if (allEl) allEl.classList.toggle('active', current === ALL && !officeMode);
  if (offEl) offEl.classList.toggle('active', current === ALL && officeMode);
  document.querySelectorAll('.gear').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); openAgentForm(el.dataset.edit); }));
  $('addAgent').onclick = () => openAgentForm(null);
}

// 送出方式：依目前畫面與成員狀態決定可以選哪些
// now = ⚡ 立即插話（中斷正在做的成員，帶著指示繼續）｜later = 🕒 這輪做完再給｜note = 📌 加入任務指示
// task = 📋 開始新任務｜reply = 回覆等你的成員｜send = 一般送出
let sendMode = null;
function workingAgent() {
  const t = selTask();
  const busy = agents.filter((a) => a.busy && (!TEAM_SEL || a.team === TEAM_SEL));
  if (t && t.stageId && WF) { const st = WF.stages.find((x) => x.id === t.stageId); const o = st && busy.find((a) => a.id === st.owner); if (o) return o; }
  return busy[0] || null;
}
function sendModes() {
  if (current === ALL) {
    const t = selTask(), w = workingAgent();
    if (t && (t.status === 'waiting_user' || t.status === 'error')) return [{ id: 'reply', label: '回覆' }];
    if (t) return [...(w ? [{ id: 'now', label: '⚡ 插話給 ' + w.name }] : []), { id: 'note', label: '📌 加入任務指示' }];
    if (w) return [{ id: 'now', label: '⚡ 插話給 ' + w.name }, { id: 'task', label: '📋 開始新任務' }];

// 圖片裁成正方形、縮成 128×128 PNG
function squareAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const size = 128, side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('讀不到這張圖')); };
    img.src = url;
  });
}

function opts(list, labels, selected) {
  return list.map((v) => `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(labels[v] || v)}</option>`).join('');
}

    try {
      if (editing) {
        await api('/api/agents/' + id, { method: 'PUT', body: JSON.stringify(body) });
        await saveLineBinding(id);
        if ($('f_reset').checked) {
          try { await api('/api/reset/' + id, { method: 'POST' }); }
          catch (e) { toast('已儲存，但' + (live && live.busy ? '成員工作中，' : '') + '沒辦法開新對話：' + e.message); }
        }
        closeModal(); toast('✅ 已儲存');
      } else {
        const r = await api('/api/agents', { method: 'POST', body: JSON.stringify(body) });
        await saveLineBinding(r.id);
        closeModal(); await refreshAgents(); selectAgent(r.id);
        toast('✅ 已新增「' + body.name.trim() + '」。其他成員要開新對話才會認識它');
      }
    } catch (e) { toast(e.message); $('f_save').disabled = false; }
  };
  if (editing) $('f_delete').onclick = async () => {
    if (!confirm('確定刪除「' + editing.name + '」？\n（對話記錄檔會保留在 data 資料夾，但介面上不會再顯示）')) return;
    try { await api('/api/agents/' + id, { method: 'DELETE' }); closeModal(); toast('已刪除'); }
    catch (e) { toast(e.message); }
  };
  setTimeout(() => $(editing ? 'f_persona' : 'f_name').focus(), 50);
}

  $('modal').classList.add('wide');

  function preview() {

          <div class="checks">${wf.stages.filter((x) => x.id !== st.id).map((x) => `<label><input type="checkbox" data-next="${esc(x.id)}" ${st.next.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('') || '<span class="help">新增其他階段後才能選</span>'}</div>
        </div>
        <div class="field"><label>🧪 自動檢查（交出前在負責成員的工作資料夾執行，全部通過才交出；每行一個指令，可寫「名稱: 指令」，最多 5 個）</label><textarea data-checks rows="2" placeholder="例如：\n單元測試: npm test\n語法檢查: python -m py_compile main.py">${esc((st.checks || []).map((c) => (c.name ? c.name + ': ' : '') + c.command).join('\n'))}</textarea></div>

      </div>`).join('') || '<p class="help">還沒有階段，按「＋ 新增階段」或套用範本。</p>';
    $('w_stages').querySelectorAll('.stage').forEach((el) => {
      const st = wf.stages[+el.dataset.i];
      el.querySelectorAll('[data-k]').forEach((inp) => {
        const k = inp.dataset.k;
        inp.addEventListener(inp.type === 'checkbox' || inp.tagName === 'SELECT' ? 'change' : 'input', () => {
          st[k] = inp.type === 'checkbox' ? inp.checked : inp.value;
          if (k === 'name') { renderNextLabels(); }
          preview();
        });
      });
      el.querySelector('[data-checks]').addEventListener('input', (e) => { st.checks = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean); preview(); });
      el.querySelectorAll('[data-next]').forEach((cb) => cb.addEventListener('change', () => {
        st.next = cb.checked ? [...st.next, cb.dataset.next] : st.next.filter((n) => n !== cb.dataset.next); preview();
      }));
      el.querySelectorAll('[data-act]').forEach((btn) => (btn.onclick = () => {
        const i = +el.dataset.i, act = btn.dataset.act;
        if (act === 'del') {
          if (!confirm('刪除「' + (st.name || '這個階段') + '」？')) return;
          wf.stages.splice(i, 1); wf.stages.forEach((x) => (x.next = x.next.filter((n) => n !== st.id)));
        } else {
          const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= wf.stages.length) return;
          [wf.stages[i], wf.stages[j]] = [wf.stages[j], wf.stages[i]];
        }
        renderStages(); preview();
      }));
    });

  function renderNextLabels() { // 階段改名時，其他卡片上的勾選文字跟著更新
    $('w_stages').querySelectorAll('[data-next]').forEach((cb) => { cb.parentElement.lastChild.textContent = ' ' + sName(cb.dataset.next); });

  $('w_add').onclick = () => {
    const id = 's' + Date.now().toString(36);
    const last = wf.stages[wf.stages.length - 1];
    if (last && !last.next.length && confirm('要讓「' + last.name + '」做完後交給新階段嗎？')) last.next.push(id);
    wf.stages.push({ id, name: '新階段', owner: '', goal: '', deliverable: '', approval: false, next: [] });
    renderStages(); preview();
    const cards = $('w_stages').querySelectorAll('.stage'); cards[cards.length - 1].scrollIntoView({ block: 'nearest' });
  };
  $('w_tpl').onclick = () => {
    if (wf.stages.length && !confirm('用範本取代目前所有階段？')) return;
    const t = FLOW_TEMPLATE();

    const find = (re) => (members.find((m) => re.test(m.role || '')) || {}).id || '';
    const pm = find(/PM|經理|規劃/i), coder = find(/Coder|工程|實作/i), qa = find(/QA|測試|品質/i);
    t.stages[0].owner = pm; t.stages[1].owner = coder; t.stages[2].owner = qa; t.stages[3].owner = pm;
    wf.name = t.name; wf.stages = t.stages; $('w_name').value = t.name;

  document.querySelectorAll('[data-tf]').forEach((b) => (b.onclick = () => { TEAM_SEL = b.dataset.tf; openTeamForm(); }));

    catch (e) { toast(e.message); }
  };
  $('t_save').onclick = async () => {
    wf.name = $('w_name').value; wf.notes = $('w_notes').value;
    const missing = wf.stages.filter((x) => !x.owner).map((x) => x.name);
    if (missing.length && !confirm('這些階段還沒指定負責成員：' + missing.join('、') + '\n還是要儲存嗎？')) return;
    try {
      const takeTurns = [...document.querySelectorAll('#w_turns input:checked')].map((x) => x.value);
      const harness = { maxReworks: $('h_rework').value, maxTaskMinutes: $('h_minutes').value, checkTimeoutSec: $('h_timeout').value, shiftPercent: $('h_shift').value, guideChars: $('h_gchars').value, headerRefresh: $('h_hdr').value };
      await api('/api/team', { method: 'PUT', body: JSON.stringify({ teamId: team.id, name: $('tm_name').value, icon: $('tm_icon').value, cwd: $('tm_cwd').value, moveMembers: !!($('tm_move') && $('tm_move').checked), workflow: wf, maxRelayHops: $('t_hops').value, urgentCooldownMin: $('t_urgent').value, takeTurns, approveWritableHandoffs: $('w_strict').checked, harness }) });
      await loadWorkflow(); closeModal(); renderAgents(); updateTop(); toast('✅ ' + $('tm_name').value + ' 的工作流程已儲存');
    } catch (e) { toast(e.message); }
  };
}

let TASKS = null, WF = null;
async function loadTasks() {
  try { TASKS = await api('/api/tasks'); } catch { return; }
  // 任務剛完成 → 辦公室撒彩帶
  const now = (TASKS.actives || []).map((t) => t.id);
  if (window.Office) for (const id of lastActiveTasks) if (!now.includes(id)) {
    const t = (TASKS.tasks || []).find((x) => x.id === id);
    if (t && t.status === 'done') Office.taskEvent({}, t);
  }
  lastActiveTasks = now;
  renderAgents();

function renderQueued(q) {
  const msgs = $('msgs');
  msgs.querySelectorAll('.row.queued').forEach((el) => el.remove());
  if (!q || !q.items.length) return;
  clearEmpty();
  const wait = q.waitingOn && q.waitingOn !== current && agentOf(q.waitingOn);
  for (const it of q.items) {
    const from = it.from && agentOf(it.from);
    const row = document.createElement('div'); row.className = 'row user queued' + (from ? ' relay' : '');
    const col = document.createElement('div'); col.className = 'col';
    const w = document.createElement('div'); w.className = 'who';
    w.textContent = '🕒 排隊中' + (wait ? '：等 ' + label(wait) + ' 做完就開始' : q.waitingOn === current ? '：等它這輪做完' : '') + (from ? '（來自 ' + label(from) + '）' : '');
    const b = document.createElement('div'); b.className = 'bubble';
    if (from) b.appendChild(renderMarkdown(it.text, current)); else b.textContent = it.text;
    col.appendChild(w); col.appendChild(b); row.appendChild(col); msgs.appendChild(row);
  }
}

const WIN_LABEL = { '5h': '5 小時', week: '每週', week_opus: '每週 Opus', week_sonnet: '每週 Sonnet' };
let USAGE = null;
function fmtReset(sec) {
  if (!sec) return '';
  const ms = sec * 1000 - Date.now();
  if (ms <= 0) return '已重置';
  const h = Math.floor(ms / 3600e3), m = Math.floor((ms % 3600e3) / 60e3);
  if (h < 24) return (h ? h + ' 小時 ' : '') + m + ' 分後重置';
  const d = new Date(sec * 1000), p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' 重置';
}
// agy 沒有剩餘額度可查：只顯示本週（週一起）各成員用了幾輪、多少 tokens，以及額度用完的狀態
function agyBlock(list) {
  if (!list || !list.length) return '';
  let h = '<div class="eng">agy<small>本週用量（週一起）</small></div>';
  for (const a of list) {
    const out = a.out && a.out.until > Date.now();
    h += `<div class="win"><span style="grid-column:1/-1" title="${esc(a.model)}"><b>${esc(a.name)}</b>　${a.runs} 輪 · ${fmtTok(a.tokens)} tokens</span>
      <span class="sub2">${out ? `<b style="color:var(--err)" title="${esc(a.out.msg || '')}">🪫 額度用完 · 預計 ${esc(fmtTime(a.out.until))}${a.out.estimated ? '（推估）' : ''} 恢復</b>`
        : a.lastQuotaAt ? '上次用完：' + esc(fmtTime(a.lastQuotaAt)) + (a.quotaHits ? `（本週 ${a.quotaHits} 次）` : '') : '本週還沒用完過'}</span></div>`;
  }
  return h + '<div class="none">agy 不提供剩餘額度，這裡是 Agent Chat 自己統計的</div>';
}

function renderUsage() {
  const el = $('usage'); if (!el) return;
  const block = (title, u) => {
    const wins = Object.entries((u && u.windows) || {}).sort(([a], [b]) => (a === '5h' ? -1 : b === '5h' ? 1 : a.localeCompare(b)));
    let h = `<div class="eng">${title}<small>${u && u.updatedAt ? '更新 ' + fmtTime(u.updatedAt) : ''}</small></div>`;
    if (!wins.length) return h + '<div class="none">還沒有資料：成員執行一次後就會出現，或按「查詢」</div>';
    for (const [k, w] of wins) {
      const reset = w.resetsAt && w.resetsAt * 1000 < Date.now();
      const used = reset ? 0 : Math.min(100, Math.max(0, w.pct));
      const cls = used >= 90 ? 'crit' : used >= 70 ? 'warn' : '';
      h += `<div class="win"><span>${esc(WIN_LABEL[k] || k)}</span><div class="bar"><i class="${cls}" style="width:${used}%"></i></div>
        <span class="sub2">剩 ${Math.round(100 - used)}%${reset ? '（已重置）' : w.resetsAt ? ' · ' + fmtReset(w.resetsAt) : ''}</span></div>`;
    }

  };
  // 收合時每家只留一行摘要（剩餘 %），省出空間給成員列表
  const mini = (title, u) => {

    '<div class="ulink" id="srcLine" title="唯讀資料表：讓成員查別人的 Google 試算表／Excel 檔">📊 資料表</div>' +

function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  return m < 1 ? '不到 1 分鐘' : m < 60 ? m + ' 分鐘' : Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分';
}
function updateThinking() {
  for (const [aid, b] of liveBubbles) {
    const a = agentOf(aid), t = b.querySelector('.thinking');
    if (!a || !t) continue;
    t.textContent = a.name + ' 工作中…' + (a.runningSince ? ' 已 ' + ago(a.runningSince) + (a.lastActivity && Date.now() - a.lastActivity > 120000 ? '（最後動靜 ' + ago(a.lastActivity) + '前）' : '') : '');
    t.classList.toggle('stall', !!a.stalled);
  }
}

function connectEvents() {
  const es = new EventSource(withToken('/api/events'));
  es.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (window.Office && ev.agentId !== '*') Office.event(ev);
    if (ev.kind === 'agents-changed') { refreshAgents(); loadWorkflow().then(() => current === ALL && updateTop()); return; }
    if (ev.kind === 'usage') { loadUsage(); return; }
    if (ev.kind === 'feedback-status') { refreshFbBadge(); if (modalShowing('fb_close')) openFeedback(); return; }
    if (ev.kind === 'feedback') { refreshFbBadge(); if (modalShowing('fb_close')) openFeedback(); toast('🐞 收到錯誤回報 #' + ev.id + '（' + ev.who + '→' + ev.agent + '）：' + ev.text); return; }
    if (ev.kind === 'line') { if (modalShowing('ln_close')) openLine(); return; }
    if (ev.kind === 'skills') { loadSkillPending(); if (CLI_OPEN && CLI_TAB === 'skill' && modalShowing('cli_close')) openSkills(); return; }
    if (ev.kind === 'clistatus') { if (CLI_OPEN && modalShowing('cli_close')) openCliStatus(CLI_TAB); return; }
    if (ev.kind === 'telegram') { loadTelegram(); return; }
    if (ev.kind === 'task') { loadTasks(); return; }
    if (ev.kind === 'harness' || ev.kind === 'harness-run') { loadHarness(ev.kind === 'harness-run'); return; }
    if (ev.kind === 'mdprop') { refreshMdBadge(); if (modalShowing('md_close')) openMdProposals(); return; }
    if (ev.kind === 'outbox') { refreshOutbox(); return; }
    if (ev.kind === 'timers') { refreshTimerBadge(); if (modalShowing('tmr_list')) openTimers(true); return; }
    if (ev.kind === 'update-available') { if (!UPD_BADGE) { UPD_BADGE = true; renderUsage(); } return; }
    if (ev.kind === 'queue') { refreshQueue(); if ((PAUSE.pauses || []).length) loadPause(); return; }
    if (ev.kind === 'pause') { loadPause(); refreshAgents(); return; }
    if (ev.kind === 'urgent') { toast(ev.status === 'interrupted' ? '⚡ ' + ev.from + ' 緊急插話給 ' + ev.to : '⚡ ' + ev.from + ' 想緊急插話給 ' + ev.to + '，但改為排隊（' + ev.reason + '）'); return; }
    const a = agentOf(ev.agentId); if (!a) return;
    if (ev.kind === 'busy') { a.busy = ev.busy; refreshAgents().then(updateThinking); return; }
    if (ev.kind === 'reset') { if (shown(ev.agentId)) selectAgent(current); return; }
    if (ev.kind === 'history') { if (shown(ev.agentId) && !a.busy) selectAgent(current); return; } // 系統直接回覆（例如 LINE 群組登記）寫進了對話紀錄
    if (ev.kind === 'queued') { if (shown(ev.agentId)) toast(a.name + ' 忙碌中，同事的訊息已排隊'); return; }
    if (!shown(ev.agentId)) { if (['user', 'segment', 'done'].includes(ev.kind)) { unread.add(ev.agentId); renderAgents(); } return; }
    const stick = nearBottom();
    if (ev.kind === 'user') { addUserRow({ text: ev.text, from: ev.from, via: ev.via, cc: ev.cc, taskId: ev.taskId, system: ev.system }, ev.agentId); addBotRow([], '', true, ev.agentId); scrollDown(true); return; }
    if (ev.kind === 'segment') liveAppend(ev.agentId, ev.segment);
    if (ev.kind === 'done') liveFinish(ev.agentId, ev.meta);
    if (stick) scrollDown(true);
  };
  es.onerror = () => { es.close(); setTimeout(() => { connectEvents(); if (current) selectAgent(current); }, 2000); };
}

    ${t.state === 'on' && t.url && wh && wh.endpoint && wh.endpoint !== t.url + '/line/webhook' ? `<div class="sk-bad">⚠️ LINE 上登記的網址（${esc(wh.endpoint)}）和目前的通道（${esc(t.url)}）<b>不一樣</b>，LINE 的訊息會送去舊網址、這裡收不到。程式會自動更新（剛開通道要等一下）；超過一兩分鐘還是這樣，按：<button id="ln_fix">🔄 立刻重設 Webhook</button></div>` : ''}
    ${wh ? `<p class="help">Webhook：${esc(wh.endpoint || '—')}｜${wh.tested ? '✅ LINE 測試通過' : '❌ ' + esc(wh.reason || '還沒通過')}${wh.active === false ? '｜⚠️ 到 LINE Developers 把「Use webhook」打開' : ''}（${ago(wh.at)}）</p>` : ''}
    <h3 class="sk-h">③ 配對（只有配對過的 LINE 帳號，才能跟成員說話）</h3>
    <div class="sk-row"><button id="ln_pair" ${L.configured ? '' : 'disabled'}>產生配對碼</button>${L.allowedCount ? '<button id="ln_unpair">清除所有配對</button>' : ''}
      ${L.pairing ? `<span class="ln-code">${esc(L.pairing.code)}</span><span class="help">把這 6 位數字傳給 LINE 上的 bot（${pairLeft} 分鐘內有效，只能用一次）</span>` : ''}</div>
    <h3 class="sk-h">④ LINE 群組</h3>
    <p class="help" style="margin:0 0 6px">把這個 LINE bot 拉進部門群組（先在官方帳號設定裡打開「允許加入群組」），再把上面的<b>配對碼貼在群組裡</b>，群組就啟用了。之後大家 <b>@它</b> 說話，就交給下面選的成員回覆；這位成員如果有勾「📋 待辦清單能力」，就會幫大家登記、查詢 Google Sheet 的待辦，沒勾就是一般對話。<b>它只處理 @它（或開頭寫呼叫詞）的訊息</b>，群組裡其他聊天不會看、不會記；群組的對話會記在那位成員的對話框裡。</p>
    <div class="sk-row"><b>群組交給：</b><select id="ln_gagent"><option value="">（不使用群組）</option>${members.map((a) => `<option value="${esc(a.id)}" ${a.id === (keep.ln_gagent !== undefined ? keep.ln_gagent : (L.groupAgentId || (members.find((x) => x.todoKeeper) || {}).id || '')) ? 'selected' : ''}>${esc(a.name)}（${esc(a.role || a.engine)}）</option>`).join('')}</select><button class="primary" id="ln_gsave">儲存群組設定</button><span class="help">${L.groupAgentName ? '目前：' + esc(L.groupAgentName) + (L.groupAgentTodo ? '（📋 待辦清單能力）' : '（一般對話）') : '⚠️ 還沒有成員負責群組'}</span></div>
    ${L.groupRisk && (L.groupRisk.block || L.groupRisk.warn) ? `<div class="sk-bad">🔒 ${esc(L.groupRisk.block ? '群組已停用：' + L.groupRisk.block + '。請換成唯讀的成員。' : L.groupRisk.warn)}${!L.groupRisk.block && L.groupAgentEffId ? ' <button id="ln_movesafe">📦 一鍵搬到安全資料夾</button>' : ''}</div>` : ''}
    <div class="sk-row"><b>呼叫詞：</b><input id="ln_gwords" value="${esc(keep.ln_gwords !== undefined ? keep.ln_gwords : L.groupWords || '')}" placeholder="選填，例如：待辦、小幫手（用頓號分隔）" style="flex:1;min-width:180px"><span class="help">訊息開頭寫這些字也算叫它（成員名稱本來就算）；@ 選不到 bot 時很好用。</span></div>
    <div class="sk-row"><span>已啟用 ${L.groups} 個群組${L.groups ? '' : '（還沒有）'}</span>${L.groups ? '<button id="ln_cgroups">清除群組</button>' : ''}<button class="primary" id="ln_todo">📋 待辦清單（Google Sheet）設定…</button></div>
    <p class="help">${q ? `本月主動推播：已用 ${q.used} ${q.type === 'limited' ? '/ ' + q.value : ''} 則（${ago(q.at)} 更新）` : `本程式這個月推播了 ${L.pushedThisMonth} 則`}${L.pushBlocked ? '　⚠️ 本月推播額度已用完，只能回覆你傳來的訊息' : ''}｜最近一次收到訊息：${ago(L.lastEventAt)}</p>
    <p class="help">在 LINE 上：直接傳文字給它；<code>/new</code> 開新對話、<code>/stop</code> 停止、<code>同意 3</code>／<code>不要 3</code> 核准或取消它提出的提醒。目前只收文字。</p>
    <p class="help">⚠️ 你的訊息會經過 LINE 的伺服器（日本），公開通道也會經過 Cloudflare。這台如果是公司電腦，請先確認資安規定允許；工作上的機密資料不要透過 LINE 傳給成員。</p>
    <div class="modal-actions"><span class="spacer"></span><button id="ln_close">關閉</button></div>`);
  $('modal').classList.add('wide');
  const act = async (fn) => { try { await fn(); } catch (e) { toast(e.message); } openLine(); };
  $('ln_close').onclick = () => { LN_URL_DIRTY = false; closeModal(); };
  if ($('ln_url')) $('ln_url').addEventListener('input', () => { LN_URL_DIRTY = true; });
  if ($('ln_fix')) $('ln_fix').onclick = () => act(async () => { const r = await api('/api/line/webhook', { method: 'POST', body: JSON.stringify({ publicUrl: t.url }) }); LN_URL_DIRTY = false; toast(r.ok ? '✅ Webhook 重設好了，LINE 測試通過' : '設定好了，但 LINE 測試沒過：' + r.reason); });
  $('ln_save').onclick = () => act(() => api('/api/line', { method: 'PUT', body: JSON.stringify({ agentId: $('ln_agent').value, groupAgentId: $('ln_gagent').value, channelSecret: $('ln_secret').value, channelAccessToken: $('ln_token').value }) }).then(() => { $('ln_secret').value = ''; $('ln_token').value = ''; toast('已儲存'); }));
  $('ln_gsave').onclick = () => act(() => api('/api/line', { method: 'PUT', body: JSON.stringify({ groupAgentId: $('ln_gagent').value, groupWords: $('ln_gwords').value }) }).then(() => toast('已儲存群組設定')));
  if ($('ln_movesafe')) $('ln_movesafe').onclick = async () => { if (await moveSafe(L.groupAgentEffId)) openLine(); };
  $('ln_check').onclick = () => act(async () => { $('ln_check').textContent = '檢查中…'; LINE_CHECK = await api('/api/line/check', { method: 'POST', body: '{}' }); });
  if ($('ln_clear')) $('ln_clear').onclick = () => { if (confirm('移除 LINE 的所有設定（secret、token、配對）？LINE 上的官方帳號不會被刪除。')) act(async () => { LINE_CHECK = null; await api('/api/line', { method: 'PUT', body: JSON.stringify({ clear: true }) }); }); };
  $('ln_tun_on').onclick = () => act(() => api('/api/line/tunnel', { method: 'POST', body: JSON.stringify({ on: true }) }));
  $('ln_tun_off').onclick = () => act(() => api('/api/line/tunnel', { method: 'POST', body: JSON.stringify({ on: false }) }));
  $('ln_wh').onclick = () => act(async () => { const r = await api('/api/line/webhook', { method: 'POST', body: JSON.stringify({ publicUrl: $('ln_url').value }) }); LN_URL_DIRTY = false; toast(r.ok ? '✅ Webhook 設定好了，LINE 測試通過' : '設定好了，但 LINE 測試沒過：' + r.reason); });
  $('ln_pair').onclick = () => act(() => api('/api/line/pair', { method: 'POST', body: '{}' }));
  $('ln_todo').onclick = () => openTodo();
  if ($('ln_cgroups')) $('ln_cgroups').onclick = () => { if (confirm('清除所有已啟用的群組？之後要在群組重新貼配對碼才會再啟用。')) act(() => api('/api/line', { method: 'PUT', body: JSON.stringify({ clearGroups: true }) })); };
  if ($('ln_unpair')) $('ln_unpair').onclick = () => { if (confirm('清除所有已配對的 LINE 帳號？之後要重新配對才能使用。')) act(() => api('/api/line/unpair', { method: 'POST', body: '{}' })); };
}

// ---------- 🧩 Skill：成員提出 → 你核准 → 系統安裝 ----------
let SKILL_PENDING = 0;
async function loadSkillPending() { try { SKILL_PENDING = (await api('/api/skills')).pending || 0; } catch {} renderUsage(); }
const SK_ST = { fetching: '⏳ 下載檢查中', ready: '🟡 等你核准', choose: '🟡 要選擇裝哪一個', failed: '❌ 失敗', installed: '✅ 已安裝', rejected: '🚫 已拒絕' };
async function openSkills() {
  CLI_OPEN = true; CLI_TAB = 'skill';
  let K = { roots: [], extra: [], members: [], requests: [], targets: [], pending: 0 };
  try { K = await api('/api/skills'); } catch (e) { toast(e.message); }
  SKILL_PENDING = K.pending || 0;
  const tsel = (id, cur) => `<select id="${id}">${K.targets.map((t) => `<option value="${esc(t.key)}" ${t.key === cur ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select>`;
  const open = K.requests.filter((r) => ['fetching', 'ready', 'choose', 'failed'].includes(r.status));
  const done = K.requests.filter((r) => ['installed', 'rejected'].includes(r.status)).slice(0, 5);
  const card = (r) => {
    const rv = r.review || {};
    let h = `<div class="hn-item sk-card"><div class="grow"><b>#${r.id} ${esc(r.title || r.name || r.source)}</b> <small style="display:inline">${SK_ST[r.status] || esc(r.status)}</small>
      <small>來源：<a href="https://github.com/${esc(r.source.split('@')[0])}" target="_blank" rel="noopener noreferrer">github.com/${esc(r.source)}</a>${r.fromName ? '｜' + esc(r.fromName) + ' 提出' : r.via === 'web' ? '｜你新增的' : ''}｜${fmtTime(r.at)}</small>`;
    if (r.description) h += `<div class="sk-desc">${esc(r.description)}</div>`;
    if (r.error) h += `<div class="sk-bad">${esc(r.error)}</div>`;
    if (r.status === 'choose') h += `<div class="sk-desc">這個 repo 有好幾個 Skill，要裝哪一個？</div>` + (r.choices || []).map((c) => `<button data-skchoose="${r.id}" data-name="${esc(c.name)}" title="${esc(c.description)}">${esc(c.name)}</button>`).join(' ');
    if (r.status === 'ready') {
      h += `<div class="sk-desc">內容：${rv.fileCount} 個檔案・${Math.max(1, Math.round(rv.bytes / 1024))} KB</div>` +
        (rv.scripts.length ? `<div class="sk-bad">⚠️ 含 ${rv.scripts.length} 個可執行的腳本：${rv.scripts.slice(0, 8).map(esc).join('、')}${rv.scripts.length > 8 ? '…' : ''}<br>Skill 被使用時，成員可能會執行這些腳本。請確認來源可信再安裝。</div>` : '<div class="sk-ok">✅ 沒有可執行的腳本（只有說明文件與資料）</div>') +
        `<details><summary>檔案清單</summary><div class="sk-files">${rv.files.map((f) => `${f.script ? '⚠️ ' : ''}${esc(f.path)} <small style="display:inline">${Math.max(1, Math.round(f.size / 1024))} KB</small>`).join('<br>')}${rv.fileCount > rv.files.length ? '<br>…' : ''}</div></details>` +
        `<div class="sk-row"><label>安裝到</label>${tsel('sk_t_' + r.id, r.targetKey)}</div>` +
        (r.exists ? `<label class="opt sk-bad"><input type="checkbox" id="sk_rep_${r.id}"> 同名的 Skill「${esc(r.name)}」已經存在：取代現有的（舊的會搬到回收區）</label>` : '');
    }
    h += '</div><div class="acts" style="flex-direction:column">' +
      (r.status === 'ready' ? `<button class="primary" data-skok="${r.id}">核准安裝</button>` : '') +
      (r.status === 'failed' ? `<button data-skretry="${r.id}">重試</button>` : '') +
      (r.status !== 'fetching' ? `<button data-skno="${r.id}">${r.status === 'failed' ? '移除' : '拒絕'}</button>` : '') + '</div></div>';
    return h;
  };
  const roots = K.roots.map((rt) => `<div class="hn-item"><div class="grow"><b>${esc(rt.label)}</b><small>${esc(rt.root)}</small>
    <div>${rt.skills.length ? rt.skills.map((k) => `<span class="cli-chip" title="${esc(k.description)}">🧩 ${esc(k.title)} <a href="#" data-skrm="${esc(k.name)}" data-root="${esc(rt.root)}" title="移除（搬到回收區）">✕</a></span>`).join(' ') : '<small style="display:inline">（還沒有 Skill）</small>'}</div></div></div>`).join('');
  const extra = K.extra.map((x) => `<div class="hn-item"><div class="grow"><b>${esc(x.cli)}</b> <small style="display:inline">${esc(x.root)}</small><div>${x.found ? (x.skills.length ? x.skills.map((k) => `<span class="cli-chip" title="${esc(k.description)}">🧩 ${esc(k.title)}</span>`).join(' ') : '<small style="display:inline">（沒有 Skill）</small>') : '<small style="display:inline">❔ 找不到這個資料夾（位置還沒在你的電腦上確認）</small>'}</div></div></div>`).join('');
  const body = `${open.length ? '<h3 class="sk-h">待處理的安裝申請</h3>' + open.map(card).join('') : ''}
    <h3 class="sk-h">新增 Skill</h3>
    <p class="help" style="margin:0 0 6px">最簡單的方式：直接跟成員說「幫我找一個做○○的 Skill 裝給 Coder」，它會提出申請。也可以在這裡貼 GitHub 來源（例如 <code>nutlope/hallmark</code> 或 GitHub 網址），系統會先下載檢查，給你看過再安裝。</p>
    <div class="sk-row"><input id="sk_src" placeholder="GitHub 來源，例如 nutlope/hallmark" style="flex:1;min-width:180px">${tsel('sk_tnew', (K.targets[1] || K.targets[0] || {}).key)}<button class="primary" id="sk_add">下載並檢查</button></div>
    <h3 class="sk-h">已安裝（Claude）</h3>${roots}
    <h3 class="sk-h">其他 CLI（只看）</h3>${extra}
    <h3 class="sk-h">每位成員用得到的 Skill</h3>
    <table class="cli-tbl"><tr><th>成員</th><th>Skill</th><th>說明</th></tr>${K.members.map((m) => `<tr><td>${esc(m.name)} <span class="badge ${esc(m.engine)}">${esc(m.engine)}</span></td><td>${m.skills.length ? m.skills.map(esc).join('、') : '—'}</td><td><small>${esc(m.note || '')}</small></td></tr>`).join('')}</table>
    ${done.length ? '<h3 class="sk-h">最近處理過的</h3>' + done.map((r) => `<div class="hn-item"><div class="grow">#${r.id} ${esc(r.title || r.source)} <small style="display:inline">${SK_ST[r.status]}・${fmtTime(r.doneAt || r.at)}${r.status === 'installed' ? '・' + esc(r.targetLabel) : ''}</small></div></div>`).join('') : ''}
    <p class="help">安全：成員只能「提出」安裝，一定要你核准；系統只從 GitHub 公開 repo 下載，先列出檔案與腳本給你看，不會執行 Skill 裡的任何東西。移除會搬到回收區（Agent Chat 的 data/skills-trash），可以找回。</p>`;
  const tabs = [['login', '🔑 登入'], ['mcp', '🔌 MCP'], ['skill', '🧩 Skill' + (SKILL_PENDING ? ' (' + SKILL_PENDING + ')' : '')]].map(([k, t]) => `<button data-ctab="${k}" class="${CLI_TAB === k ? 'primary' : ''}">${t}</button>`).join('');
  const keep = $('modal').querySelector('.cli-body'), top = keep && CLI_TAB === 'skill' ? keep.scrollTop : 0;
  openModal(`<h2>🧰 CLI 狀態</h2>
    <p class="lead">Skill 是給成員的「工作說明書＋工具包」。成員提出、你核准，系統替你安裝，不用打指令。</p>
    <div class="cli-tabs">${tabs}</div>
    <div class="cli-body">${body}</div>
    <div class="modal-actions"><span class="spacer"></span><button id="cli_close">關閉</button></div>`);
  $('modal').classList.add('wide');
  if (top) $('modal').querySelector('.cli-body').scrollTop = top;
  const act = async (url, payload) => { try { await api(url, { method: 'POST', body: JSON.stringify(payload || {}) }); } catch (e) { toast(e.message); } openSkills(); };
  document.querySelectorAll('[data-ctab]').forEach((b) => (b.onclick = () => (b.dataset.ctab === 'skill' ? openSkills() : openCliStatus(b.dataset.ctab))));
  $('cli_close').onclick = () => { CLI_OPEN = false; closeModal(); };
  $('sk_add').onclick = () => { const v = $('sk_src').value.trim(); if (v) act('/api/skills/requests', { source: v, target: $('sk_tnew').value }); };
  document.querySelectorAll('[data-skok]').forEach((b) => (b.onclick = () => {
    const id = b.dataset.skok, r = K.requests.find((x) => String(x.id) === id), sc = r && r.review && r.review.scripts.length;
    if (!confirm('確定安裝「' + ((r && (r.title || r.name)) || '') + '」？' + (sc ? '\n⚠️ 它含 ' + sc + ' 個可執行的腳本。' : ''))) return;
    act('/api/skills/requests/' + id + '/approve', { target: $('sk_t_' + id).value, replace: !!($('sk_rep_' + id) && $('sk_rep_' + id).checked) });
  }));
  document.querySelectorAll('[data-skno]').forEach((b) => (b.onclick = () => act('/api/skills/requests/' + b.dataset.skno + '/reject')));
  document.querySelectorAll('[data-skretry]').forEach((b) => (b.onclick = () => act('/api/skills/requests/' + b.dataset.skretry + '/retry')));
  document.querySelectorAll('[data-skchoose]').forEach((b) => (b.onclick = () => act('/api/skills/requests/' + b.dataset.skchoose + '/choose', { skill: b.dataset.name })));
  document.querySelectorAll('[data-skrm]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); if (confirm('移除 Skill「' + b.dataset.skrm + '」？（搬到回收區，可以找回）')) act('/api/skills/remove', { root: b.dataset.root, name: b.dataset.skrm }); }));
}

// ---------- 🧰 CLI 狀態（只看不改）----------
let CLI_OPEN = false, CLI_TAB = 'login';
const CLI_ICON = { ok: '✅', no: '❌', warn: '⚠️', unknown: '❔', fail: '❌', configured: '⚙️', off: '⏸' };
async function openCliStatus(tab) {
  CLI_TAB = tab || CLI_TAB; CLI_OPEN = true;
  let S = { engines: [], members: [] };
  try { S = await api('/api/clistatus'); } catch (e) { toast(e.message); }
  if (CLI_TAB === 'skill') return openSkills();
  const tabs = [['login', '🔑 登入'], ['mcp', '🔌 MCP'], ['skill', '🧩 Skill' + (SKILL_PENDING ? ' (' + SKILL_PENDING + ')' : '')]].map(([k, t]) => `<button data-ctab="${k}" class="${CLI_TAB === k ? 'primary' : ''}">${t}</button>`).join('');
  const when = S.running ? '檢查中…（第一次可能要一分鐘，MCP 會實際連線檢查）' : S.at ? '上次檢查：' + fmtTime(S.at) : '還沒檢查過';
  let body = '';
  if (!S.engines.length) body = `<p class="help">${S.running ? '⏳ 檢查中，完成後會自動更新…' : '按「🔄 重新檢查」開始。'}</p>`;
  else if (CLI_TAB === 'login') {
    body = S.engines.map((e) => {
      const l = e.login || {};
      const st = !e.installed ? '❌ 找不到這個 CLI（沒安裝，或路徑沒設定）' : `${CLI_ICON[l.state] || '❔'} ${esc(l.detail || '無法判斷')}${l.email ? '｜' + esc(l.email) : ''}${l.org ? '｜' + esc(l.org) : ''}`;
      const lr = l.lastRun ? `<small>最近一次成員執行：${l.lastRun.ok ? '✅ 正常' : '⚠️ ' + esc(l.lastRun.err || '失敗')}・${fmtTime(l.lastRun.at)}</small>` : '';
      const help = e.installed && l.state !== 'ok' ? `<small>👉 ${esc(e.loginHelp)}</small>` : '';
      return `<div class="hn-item"><div class="grow"><b>${esc(e.name)}</b> <span class="cli-ver">${e.version ? esc(e.version) : e.installed ? '版本不明' : ''}</span><div>${st}</div>${l.source ? ` <small>（依據：${esc(l.source)}）</small>` : ''}${lr}${help}</div></div>`;
    }).join('') + '<p class="help">登入要在這台電腦的 PowerShell 做（網頁無法替你登入）；登入後按「🔄 重新檢查」。</p>';
  } else {
    const srv = (list) => list.length ? list.map((x) => `<span class="cli-chip" title="${esc(x.detail || '')}">${CLI_ICON[x.status] || '❔'} ${esc(x.name)}</span>`).join(' ') : '<small>（沒有設定 MCP）</small>';
    body = S.engines.filter((e) => e.installed).map((e) => `<h3 style="margin:12px 0 4px;font-size:14px">${esc(e.name)}</h3>` + e.mcp.map((m) =>
      `<div class="hn-item"><div class="grow">${m.cwd ? `<small>📁 ${esc(m.cwd)}</small>` : ''}<div>${m.unknown ? '❔ 無法判斷' : srv(m.servers)}</div><small>來源：${esc(m.source)}</small></div></div>`).join('')).join('') +

// 網頁端的錯誤也記下來（附在問題回報裡）；每次開啟頁面最多送 30 筆
let clientErrSent = 0;
function reportClientError(kind, message, where) {
  if (clientErrSent++ >= 30 || !message) return;
  fetch(withToken('/api/diag/client-error'), { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, message: String(message).slice(0, 800), where: String(where || '').slice(0, 300) }) }).catch(() => {});
}
window.addEventListener('error', (e) => reportClientError('js', e.message, (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '')));
window.addEventListener('unhandledrejection', (e) => reportClientError('promise', e.reason && (e.reason.stack || e.reason.message || e.reason), ''));

      <div class="field full tf-days"><label>哪幾天</label><div class="tf-days-row">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<label class="opt"><input type="checkbox" data-day="${d}" ${days.includes(d) ? 'checked' : ''}> ${WEEKDAYS[d]}</label>`).join('')}
        <button type="button" id="tf_wk">平日</button><button type="button" id="tf_all">每天</button></div></div>
      <div class="field"><label>什麼時候通知你（Telegram）</label><select id="tf_notify">
        <option value="changes" ${t.notify === 'changes' ? 'selected' : ''}>只在有異常或失敗時（建議）</option>
        <option value="always" ${t.notify === 'always' ? 'selected' : ''}>每次都通知</option>
        <option value="never" ${t.notify === 'never' ? 'selected' : ''}>不通知（只記錄）</option></select></div>
      <div class="field"><label class="opt"><input type="checkbox" id="tf_own" ${t.ownSession !== false ? 'checked' : ''}> 用獨立的對話</label><span class="help">建議勾選：排程有自己的對話，不會把你和成員的主對話越拉越長</span></div>
      <div class="field"><label class="opt"><input type="checkbox" id="tf_keep" ${t.keepSession ? 'checked' : ''}> 記得上次的對話</label><span class="help">預設不勾：每次都開全新的對話，只帶上次結果的摘要，不會一個鐘頭一輪地越堆越長、越花額度。勾了會一直接著同一段對話（要靠它記住很多細節才勾）</span></div>
      <div class="field full"><label>🔍 前置檢查（選填，不花 AI 額度）</label><input id="tf_pre" maxlength="500" value="${esc(t.precheck || '')}" placeholder="例如 node pm/check_dispatch.mjs">
        <span class="help">到點先在成員的工作資料夾跑這個指令：<b>沒有輸出 = 沒事，直接跳過、不叫醒成員</b>；有輸出才叫醒成員並把輸出給他看。腳本可以請成員幫你寫（沒有待辦時不要印任何東西）。手動「▶ 執行」不會先檢查。</span></div>
      <div class="field full"><label class="opt"><input type="checkbox" id="tf_pause" ${t.allowPause !== false ? 'checked' : ''}> 事情都做完時，讓成員可以先暫停這個排程（有新任務開始時自動恢復）</label></div>
    </div>
    <p class="help" id="tf_est"></p>
    <div class="modal-actions"><span class="spacer"></span><button id="tf_cancel">取消</button><button class="primary" id="tf_save">${fromProposal ? '✅ 核准' : '儲存'}</button></div>`);
  const sync = () => {
    const k = $('tf_kind').value;
    document.querySelectorAll('.tf-every').forEach((e) => (e.style.display = k === 'every' ? '' : 'none'));
    document.querySelectorAll('.tf-daily').forEach((e) => (e.style.display = k === 'daily' ? '' : 'none'));
    document.querySelectorAll('.tf-once').forEach((e) => (e.style.display = k === 'once' ? '' : 'none'));
    document.querySelector('.tf-days').style.display = k === 'once' ? 'none' : '';
    const nd = document.querySelectorAll('[data-day]:checked').length;
    let est = '';
    if (k === 'every') {
      const m = Math.max(15, Number($('tf_min').value) || 60);
      const f = $('tf_from').value, to = $('tf_to').value;
      const span = f && to ? Math.max(0, (Number(to.slice(0, 2)) * 60 + Number(to.slice(3))) - (Number(f.slice(0, 2)) * 60 + Number(f.slice(3)))) : 1440;
      const perDay = Math.floor(span / m) + 1;
      est = '大約每天 ' + perDay + ' 次、每週 ' + perDay * nd + ' 次（每次都會用到一點 CLI 額度）';
    } else if (k === 'daily') est = '每週 ' + nd + ' 次';
    $('tf_est').textContent = est;
  };
  ['tf_kind', 'tf_min', 'tf_from', 'tf_to'].forEach((id) => ($(id).oninput = $(id).onchange = sync));
  document.querySelectorAll('[data-day]').forEach((e) => (e.onchange = sync));
  $('tf_wk').onclick = () => { document.querySelectorAll('[data-day]').forEach((e) => (e.checked = ['1', '2', '3', '4', '5'].includes(e.dataset.day))); sync(); };
  $('tf_all').onclick = () => { document.querySelectorAll('[data-day]').forEach((e) => (e.checked = true)); sync(); };
  sync();
  $('tf_cancel').onclick = () => openTimers();
  $('tf_save').onclick = async () => {
    const k = $('tf_kind').value;
    const body = { name: $('tf_name').value, agentId: $('tf_agent').value, prompt: $('tf_prompt').value, notify: $('tf_notify').value, ownSession: $('tf_own').checked, keepSession: $('tf_keep').checked, precheck: $('tf_pre').value, allowPause: $('tf_pause').checked,
      schedule: k === 'every' ? { kind: k, minutes: Number($('tf_min').value) } : k === 'daily' ? { kind: k, time: $('tf_time').value } : { kind: k, at: new Date($('tf_at').value).getTime() },
      days: [...document.querySelectorAll('[data-day]:checked')].map((e) => Number(e.dataset.day)),
      hours: k === 'every' && $('tf_from').value && $('tf_to').value ? { from: $('tf_from').value, to: $('tf_to').value } : null };
    if (k !== 'once' && !body.days.length) { toast('至少選一天'); return; }
    try {
      if (fromProposal) await api('/api/timers/proposals/' + t.id + '/accept', { method: 'POST', body: JSON.stringify(body) });
      else if (t.id) await api('/api/timers/' + t.id, { method: 'PUT', body: JSON.stringify(body) });
      else await api('/api/timers', { method: 'POST', body: JSON.stringify(body) });
      openTimers();
    } catch (e) { toast(e.message); }
  };
}

// ---------- ⬆️ 更新／重新啟動 ----------
async function openUpdate() {
  let st;
  try { st = await api('/api/update'); } catch (e) { toast(e.message); return; }
  const busyNote = (st.busy.length ? st.busy.join('、') + ' 正在工作' : '') + (st.tasks ? (st.busy.length ? '，' : '') + '有 ' + st.tasks + ' 件任務進行中' : '');
  openModal(`<h2>⬆️ 更新／重新啟動</h2>
    <p class="lead">目前是 v${esc(st.version)}。更新會從 GitHub 下載新版本，然後自動重新啟動；新版本如果起不來，會自動退回原本的版本。</p>
    ${st.failed ? `<div class="warn-box">⚠️ 上次更新到 ${esc(st.failed.toVersion || st.failed.to || '')} 後無法啟動，已自動退回 v${esc(st.failed.fromVersion || '')}。<button id="up_failrep">🐞 產生問題回報</button><button id="up_failok">知道了</button></div>` : ''}
    ${st.launcher ? '' : `<div class="warn-box">這次不是用新版 start.bat 啟動的，沒辦法自動重啟。請關掉黑色視窗、重新執行 start.bat 一次，之後就能一鍵更新。</div>`}
    <div id="up_info" class="help">檢查中…</div>
    ${busyNote ? `<p class="help warn-line">⚠️ ${esc(busyNote)}：重新啟動會中斷正在進行的工作（任務會暫停，之後回覆就能繼續）。</p>` : ''}
    <p class="help">沒勾「記住這台電腦」的話，重新啟動後要再輸入一次密碼。</p>
    <div class="modal-actions"><button id="up_restart" ${st.launcher ? '' : 'disabled'}>🔄 只重新啟動</button><span class="spacer"></span><button id="up_close">關閉</button><button class="primary" id="up_go" disabled>⬆️ 更新並重新啟動</button></div>`);
  $('up_close').onclick = closeModal;
  if ($('up_failok')) $('up_failok').onclick = async () => { await api('/api/update/failed', { method: 'DELETE' }).catch(() => {}); openUpdate(); };
  if ($('up_failrep')) $('up_failrep').onclick = () => openReport({ description: '一鍵更新後新版本無法啟動，已自動退回' });
  const confirmBusy = () => !busyNote || confirm(busyNote + '，重新啟動會中斷。確定嗎？');
  $('up_restart').onclick = async () => {
    if (!confirmBusy()) return;
    try { await api('/api/restart', { method: 'POST' }); waitRestart('重新啟動中…'); } catch (e) { toast(e.message); }
  };
  let ck;
  try { ck = await api('/api/update/check', { method: 'POST' }); } catch (e) { $('up_info').textContent = '⚠️ ' + e.message; return; }
  if (!$('up_info')) return;
  if (!ck.ok) { $('up_info').innerHTML = '⚠️ ' + esc(ck.error); return; }
  UPD_BADGE = ck.behind > 0; renderUsage();
  if (!ck.behind) { $('up_info').innerHTML = '✅ 已經是最新版（' + esc(ck.branch) + ' ' + esc(ck.head) + '）'; return; }
  $('up_info').innerHTML = `<b>有新版本${ck.remoteVersion ? ' v' + esc(ck.remoteVersion) : ''}</b>（${ck.behind} 個更新）：<ul class="up-list">${ck.commits.map((c) => '<li>' + esc(c.replace(/^\w+ /, '')) + '</li>').join('')}</ul>` +
    (ck.dirty.length ? `<p class="warn-line">⚠️ 這些檔案你改過：${esc(ck.dirty.join('、'))}。${ck.dirty.length === 1 && ck.dirty[0] === 'start.bat' ? '更新時會自動把你的 set 設定搬到 local-settings.txt，再換成新的 start.bat。' : '為了不蓋掉你的修改，要先還原才能更新。'}</p>` : '');
  $('up_go').disabled = !st.launcher;
  $('up_go').onclick = async () => {
    if (!confirmBusy()) return;
    $('up_go').disabled = true; $('up_go').textContent = '更新中…';
    try {
      const r = await api('/api/update', { method: 'POST' });
      if (r.upToDate) { toast('已經是最新版'); return openUpdate(); }
      if (!r.restarting) { $('up_info').innerHTML = '✅ 已下載新版本，但' + esc(r.note || '沒辦法自動重啟'); return; }
      waitRestart('已更新到 ' + (r.toVersion ? 'v' + r.toVersion : r.to) + '，重新啟動中…');
    } catch (e) { toast(e.message); $('up_go').disabled = false; $('up_go').textContent = '⬆️ 更新並重新啟動'; }
  };
}
// 等伺服器重新啟動完成（started 時間變了）再重新整理頁面
async function waitRestart(msg) {
  let before = null;
  try { before = (await fetch('/api/info', { cache: 'no-store' }).then((r) => r.json())).started; } catch {}
  openModal(`<h2>🔄 ${esc(msg)}</h2><p class="lead" id="wr_t">通常 5～15 秒，好了會自動重新整理。</p>`);
  const t0 = Date.now();
  const tick = async () => {
    try {
      const r = await fetch('/api/info', { cache: 'no-store' });
      if (r.status === 401) { location.reload(); return; } // 新的伺服器起來了，只是要重新登入
      const j = await r.json();
      if (j.started && j.started !== before) { location.reload(); return; }
    } catch {}
    if (Date.now() - t0 > 120000) { $('wr_t').innerHTML = '超過 2 分鐘還沒好。請看電腦上的黑色視窗有沒有錯誤訊息，或在 Telegram 傳 /report。'; return; }
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1500);
}

function openLogout() {
  openModal(`<h2>🔒 登出</h2>
    <p class="lead">登出後要重新輸入密碼。如果手機或別台電腦曾勾「記住這台電腦」而你不再信任它，選「登出所有裝置」。</p>
    <div class="modal-actions"><button id="lo_all">登出所有裝置</button><span class="spacer"></span><button id="lo_cancel">取消</button><button class="primary" id="lo_one">登出這個瀏覽器</button></div>`);
  const go = async (all) => {
    try { await api('/api/auth/logout', { method: 'POST', body: JSON.stringify({ all }) }); } catch {}
    location.reload();
  };
  $('lo_cancel').onclick = closeModal;
  $('lo_one').onclick = () => go(false);
  $('lo_all').onclick = () => { if (confirm('所有裝置（包含記住的電腦、手機）都要重新登入，確定嗎？')) go(true); };
}
function showLogin(message) {
  let remember = true;
  try { remember = localStorage.getItem('agentchat_remember') !== '0'; } catch {}
  openModal(`<h2>Agent Chat 安全登入</h2>
    <p class="lead">輸入第一次啟動時黑色視窗顯示的管理密碼（或 start.bat 設定的 ACCESS_TOKEN）。忘記密碼：關掉黑色視窗，刪除 data\\admin-password-hash.json 後重開 start.bat，會顯示新密碼。</p>
    <form id="authForm" onsubmit="return false">
      <input type="text" name="username" value="agent-chat" autocomplete="username" hidden>
      <div class="field"><input id="authSecret" type="password" placeholder="管理密碼" autocomplete="current-password"></div>
      <label class="opt"><input type="checkbox" id="authRemember" ${remember ? 'checked' : ''}> 記住這台電腦 30 天（伺服器重開、更新後也不用重新登入；公用電腦請不要勾）</label>
    </form>
    <p id="authError" class="seg-error">${esc(message || '')}</p>
    <div class="modal-actions"><button id="authSubmit" class="primary">登入</button></div>`);
  async function submit() {
    const password = $('authSecret').value, rem = $('authRemember').checked;
    try { localStorage.setItem('agentchat_remember', rem ? '1' : '0'); } catch {}
    $('authSubmit').disabled = true;
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: password, remember: rem }) });
      if (!r.ok) throw new Error('密碼不正確或暫時鎖定，請檢查伺服器設定');
      closeModal();
      await init();
    } catch (e) { $('authError').textContent = e.message; }
    finally { if ($('authSubmit')) $('authSubmit').disabled = false; }
  }
  $('authSubmit').onclick = submit;
  $('authSecret').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  $('authSecret').focus();
}
init();
</script>
